<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flashBeam</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel2: #1d2130;
    --border: #2a2f42;
    --text: #d7dae3;
    --dim: #8a90a5;
    --accent: #7aa2f7;
    --green: #9ece6a;
    --red: #f7768e;
    --amber: #e0af68;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  header .sub { color: var(--dim); font-size: 12.5px; }

  main { flex: 1; display: flex; min-height: 0; }

  /* ---------- search list ---------- */
  aside {
    width: 400px;
    flex-shrink: 0;
    overflow-y: auto;
    border-right: 1px solid var(--border);
    padding: 12px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .card.selected { border-color: var(--accent); }
  .card-head { display: flex; align-items: center; gap: 8px; }
  .card-head .title { font-weight: 600; flex: 1; }
  .tag {
    font-size: 11px;
    color: var(--accent);
    background: rgba(122,162,247,.12);
    border-radius: 4px;
    padding: 1px 7px;
    white-space: nowrap;
  }
  .desc { color: var(--dim); font-size: 12.5px; margin: 7px 0 9px; }
  .params { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .param { display: flex; flex-direction: column; gap: 2px; }
  .param label { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }
  .param input {
    width: 84px;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 4px 7px;
    font: 12.5px ui-monospace, "SF Mono", Menlo, monospace;
  }
  .param input:focus { outline: none; border-color: var(--accent); }
  .card-foot { display: flex; align-items: center; gap: 10px; }
  button {
    font: 600 12.5px inherit;
    border: none;
    border-radius: 6px;
    padding: 6px 16px;
    cursor: pointer;
  }
  button.run { background: var(--accent); color: #10131c; }
  button.stop { background: var(--red); color: #10131c; }
  button.ghost {
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--border);
    padding: 5px 12px;
  }
  button:hover { filter: brightness(1.12); }

  .chip {
    font-size: 11.5px;
    font-weight: 600;
    border-radius: 10px;
    padding: 2px 10px;
  }
  .chip.running { color: var(--amber); background: rgba(224,175,104,.14); }
  .chip.done    { color: var(--green); background: rgba(158,206,106,.14); }
  .chip.error   { color: var(--red);   background: rgba(247,118,142,.14); }
  .chip.stopped { color: var(--dim);   background: rgba(138,144,165,.14); }
  .chip.running::before {
    content: "●"; margin-right: 5px;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .25; } }

  /* ---------- console ---------- */
  section {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .console-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .console-bar .job-title { font-weight: 600; }
  .console-bar .meta { color: var(--dim); font-size: 12px; }
  .console-bar .spacer { flex: 1; }
  .console-bar label.auto {
    color: var(--dim); font-size: 12px;
    display: flex; align-items: center; gap: 5px; cursor: pointer;
  }
  #output {
    flex: 1;
    overflow: auto;
    margin: 0;
    padding: 14px 16px 30px;
    font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    white-space: pre;
    color: #b6bdd3;
  }
  #output .empty { color: var(--dim); font-style: italic; }

  /* ---------- saved results ---------- */
  button.ghost.active { color: var(--accent); border-color: var(--accent); }
  #results { flex: 1; overflow: auto; padding: 14px 18px; display: none; }
  #results .empty { color: var(--dim); font-style: italic; }
  .res-group h3 { font-size: 13.5px; margin: 20px 0 8px; }
  .res-group:first-child h3 { margin-top: 0; }
  .res-group h3 .file { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 7px; }
  .res-row {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .res-top { display: flex; align-items: flex-start; gap: 10px; }
  .res-word {
    flex: 1;
    font: 12.5px ui-monospace, "SF Mono", Menlo, monospace;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .res-variant {
    font-size: 11px; color: var(--amber);
    background: rgba(224,175,104,.12);
    border-radius: 4px; padding: 1px 7px; white-space: nowrap;
  }
  .res-row .del {
    background: none; border: none; color: var(--dim);
    cursor: pointer; padding: 0 4px; font-size: 13px;
  }
  .res-row .del:hover { color: var(--red); }
  .res-meta { color: var(--dim); font-size: 11.5px; margin-top: 4px; }
  .res-matrix {
    margin: 8px 0 0;
    font: 11.5px ui-monospace, "SF Mono", Menlo, monospace;
    color: #b6bdd3;
    overflow-x: auto;
    white-space: pre;
  }
</style>
</head>
<body>

<header>
  <h1>⚡ flash<span>Beam</span></h1>
  <div class="sub">beam-search console — pick a search, tune the knobs, run</div>
</header>

<main>
  <aside id="cards"></aside>
  <section>
    <div class="console-bar">
      <span class="job-title" id="jobTitle">No run selected</span>
      <span class="chip" id="jobChip" style="display:none"></span>
      <span class="meta" id="jobMeta"></span>
      <span class="spacer"></span>
      <button class="ghost" id="resultsBtn">Results</button>
      <label class="auto" id="autoscrollLabel"><input type="checkbox" id="autoscroll" checked> auto-scroll</label>
      <button class="ghost" id="clearBtn">Clear</button>
      <button class="stop" id="stopBtn" style="display:none">Stop</button>
    </div>
    <pre id="output"><span class="empty">Run a search to see its output here.</span></pre>
    <div id="results"></div>
  </section>
</main>

<script>
const PARAM_LABELS = {
  t_param: "t",
  beam_width: "beam",
  flash_size: "flash",
  max_iterations: "iters",
  max_solutions: "sols",
};

const esc = s => String(s).replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let searches = [];
let latestJobByScript = {};   // script -> job summary
let selectedJobId = null;
let outputOffset = 0;
let view = "console";         // "console" | "results"
let resultsCache = [];

const $ = id => document.getElementById(id);

async function api(path, opts) {
  const r = await fetch(path, opts);
  return r.json();
}

/* ---------- cards ---------- */

function buildCards() {
  const root = $("cards");
  root.innerHTML = "";
  for (const s of searches) {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.script = s.file;

    const paramInputs = Object.entries(s.params).map(([k, v]) => `
      <div class="param">
        <label>${PARAM_LABELS[k] || k}</label>
        ${k === "t_param"
          ? `<input type="text" placeholder="9, 5/2, sqrt(2), …" data-param="${k}" value="${v}">`
          : `<input type="number" min="${k === "flash_size" ? 0 : 1}" data-param="${k}" value="${v}"${k === "flash_size" ? ' title="0 = no flash (standard beam search)"' : ""}>`}
      </div>`).join("");

    card.innerHTML = `
      <div class="card-head">
        <span class="title">${s.title}</span>
        <span class="tag">${s.group}</span>
      </div>
      <div class="desc">${s.description}</div>
      ${paramInputs ? `<div class="params">${paramInputs}</div>` : ""}
      <div class="card-foot">
        <button class="run">Run</button>
        <span class="chip" style="display:none"></span>
      </div>`;

    card.querySelector(".card-foot button").addEventListener("click", e => {
      e.stopPropagation();
      onRunOrStop(s.file, card);
    });
    card.addEventListener("click", () => {
      const job = latestJobByScript[s.file];
      if (job) selectJob(job.id);
    });
    root.appendChild(card);
  }
}

function cardParams(card) {
  const params = {};
  card.querySelectorAll("input[data-param]").forEach(inp => {
    if (inp.value === "") return;
    params[inp.dataset.param] = inp.dataset.param === "t_param"
      ? inp.value.trim()
      : parseInt(inp.value, 10);
  });
  return params;
}

async function onRunOrStop(script, card) {
  const job = latestJobByScript[script];
  if (job && job.status === "running") {
    await api(`/api/jobs/${job.id}/stop`, { method: "POST" });
    return;
  }
  const res = await api("/api/run", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ script, params: cardParams(card) }),
  });
  if (res.error) { alert(res.error); return; }
  latestJobByScript[script] = res;
  selectJob(res.id);
  refreshStatuses();
}

/* ---------- selection & console ---------- */

function selectJob(id) {
  if (view !== "console") { view = "console"; updateView(); }
  if (selectedJobId === id) return;
  selectedJobId = id;
  outputOffset = 0;
  $("output").textContent = "";
  pollSelected();
}

function titleFor(script) {
  const s = searches.find(x => x.file === script);
  return s ? s.title : script;
}

function fmtElapsed(job) {
  const end = job.ended || Date.now() / 1000;
  const sec = Math.max(0, Math.round(end - job.started));
  const m = Math.floor(sec / 60), s = sec % 60;
  return m ? `${m}m ${s}s` : `${s}s`;
}

function setChip(el, status) {
  el.style.display = "";
  el.className = "chip " + status;
  el.textContent = status;
}

function renderConsoleBar(job) {
  $("jobTitle").textContent = titleFor(job.script);
  setChip($("jobChip"), job.status);
  const bits = [fmtElapsed(job)];
  if (job.status === "error" && job.returncode != null)
    bits.push(`exit ${job.returncode}`);
  $("jobMeta").textContent = bits.join(" · ");
  $("stopBtn").style.display = job.status === "running" ? "" : "none";
}

async function pollSelected() {
  if (!selectedJobId) return;
  const job = await api(`/api/jobs/${selectedJobId}?offset=${outputOffset}`);
  if (job.error || job.id !== selectedJobId) return;
  latestJobByScript[job.script] = job;
  if (view === "console") renderConsoleBar(job);
  if (job.lines.length) {
    const out = $("output");
    if (outputOffset === 0) out.textContent = "";
    out.textContent += job.lines.join("\n") + "\n";
    outputOffset = job.next_offset;
    if ($("autoscroll").checked) out.scrollTop = out.scrollHeight;
  }
}

/* ---------- card status chips ---------- */

async function refreshStatuses() {
  const all = await api("/api/jobs");
  // keep the newest job per script (list is sorted newest-first)
  for (const j of all) {
    if (!(j.script in latestJobByScript) ||
        latestJobByScript[j.script].started <= j.started) {
      latestJobByScript[j.script] = j;
    }
  }
  document.querySelectorAll(".card").forEach(card => {
    const job = latestJobByScript[card.dataset.script];
    const chip = card.querySelector(".card-foot .chip");
    const btn = card.querySelector(".card-foot button");
    card.classList.toggle("selected", !!job && job.id === selectedJobId);
    if (!job) { chip.style.display = "none"; return; }
    setChip(chip, job.status);
    if (job.status === "running") {
      btn.textContent = "Stop";
      btn.className = "stop";
    } else {
      btn.textContent = "Run";
      btn.className = "run";
    }
  });
}

/* ---------- saved results ---------- */

function updateView() {
  const res = view === "results";
  $("output").style.display = res ? "none" : "";
  $("results").style.display = res ? "block" : "none";
  $("autoscrollLabel").style.display = res ? "none" : "";
  $("clearBtn").style.display = res ? "none" : "";
  $("resultsBtn").classList.toggle("active", res);
  if (res) {
    $("jobTitle").textContent = "Saved results";
    $("jobChip").style.display = "none";
    $("jobMeta").textContent = "outputs/results.db";
    $("stopBtn").style.display = "none";
    renderResults();
  } else if (!selectedJobId) {
    $("jobTitle").textContent = "No run selected";
    $("jobMeta").textContent = "";
  } else {
    pollSelected();
  }
}

function fmtParams(p) {
  try {
    return Object.entries(JSON.parse(p))
      .map(([k, v]) => `${PARAM_LABELS[k] || k} ${v}`).join(", ");
  } catch { return ""; }
}

function renderResults() {
  const root = $("results");
  if (!resultsCache.length) {
    root.innerHTML = '<div class="empty">No saved solutions yet — solutions found by any run are recorded here automatically.</div>';
    return;
  }
  const byScript = {};
  for (const r of resultsCache) (byScript[r.script] ??= []).push(r);
  const order = searches.map(s => s.file).filter(f => byScript[f]);
  for (const f of Object.keys(byScript)) if (!order.includes(f)) order.push(f);

  root.innerHTML = order.map(f => `
    <div class="res-group">
      <h3>${esc(titleFor(f))}<span class="file">${esc(f)} · ${byScript[f].length}</span></h3>
      ${byScript[f].map(r => `
        <div class="res-row">
          <div class="res-top">
            <span class="res-word">${esc(r.word)}</span>
            ${r.variant ? `<span class="res-variant">${esc(r.variant)}</span>` : ""}
            <button class="del" data-id="${r.id}" title="Delete this result">✕</button>
          </div>
          <div class="res-meta">${esc((r.found_at || "").replace("T", " ").slice(0, 16))} · length ${r.word_length}${r.score != null ? ` · score ${r.score}` : ""}${r.params && r.params !== "{}" ? ` · ${esc(fmtParams(r.params))}` : ""}</div>
          ${r.matrix ? `<pre class="res-matrix">${esc(r.matrix)}</pre>` : ""}
        </div>`).join("")}
    </div>`).join("");

  root.querySelectorAll(".del").forEach(btn => btn.onclick = async () => {
    if (!confirm("Delete this saved solution?")) return;
    await api(`/api/results/${btn.dataset.id}/delete`, { method: "POST" });
    refreshResults();
  });
}

async function refreshResults() {
  resultsCache = await api("/api/results");
  $("resultsBtn").textContent = `Results (${resultsCache.length})`;
  if (view === "results") renderResults();
}

/* ---------- wiring ---------- */

$("resultsBtn").addEventListener("click", () => {
  view = view === "results" ? "console" : "results";
  updateView();
  if (view === "results") refreshResults();
});
$("clearBtn").addEventListener("click", () => {
  $("output").textContent = "";
});
$("stopBtn").addEventListener("click", async () => {
  if (selectedJobId) await api(`/api/jobs/${selectedJobId}/stop`, { method: "POST" });
});

(async function init() {
  searches = await api("/api/searches");
  buildCards();
  await refreshStatuses();
  await refreshResults();
  // resume watching a still-running job if the page was reloaded
  const running = Object.values(latestJobByScript).find(j => j.status === "running");
  if (running) selectJob(running.id);
  setInterval(pollSelected, 700);
  setInterval(refreshStatuses, 1500);
  setInterval(refreshResults, 5000);
})();
</script>
</body>
</html>
