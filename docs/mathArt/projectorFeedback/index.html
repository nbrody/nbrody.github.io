<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Loop — Virtual Light Installation</title>
    <meta name="description"
        content="A 3D simulation of a camera-projector feedback loop with three draggable projectors.">
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap"
        rel="stylesheet">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>
    <div id="container"></div>
    <div id="ui-overlay">
        <div id="title-bar">
            <h1>Feedback Loop</h1>
            <p class="subtitle">Drag projectors · Click wall to inject light · ⌘/Ctrl+Click to orbit</p>
        </div>
        <div id="controls-toggle" title="Toggle Controls">⚙</div>
        <div id="controls-panel" class="hidden">
            <div class="control-section">
                <h3>Presets</h3>
                <div id="preset-row">
                    <button class="chip" data-preset="nebula">Nebula</button>
                    <button class="chip" data-preset="sierpinski">Sierpinski</button>
                    <button class="chip" data-preset="galaxy">Galaxy</button>
                    <button class="chip" data-preset="embers">Embers</button>
                    <button class="chip" data-preset="ocean">Ocean</button>
                </div>
            </div>
            <div class="control-section">
                <h3>Simulation</h3>
                <div class="control-row"><label>Decay</label><input type="range" id="decay" min="0.85" max="0.995"
                        step="0.005"><span class="val" id="decay-val"></span></div>
                <div class="control-row"><label>Gain</label><input type="range" id="gain" min="0.3" max="2.5"
                        step="0.05"><span class="val" id="gain-val"></span></div>
            </div>
            <div class="control-section">
                <h3>Camera</h3>
                <div class="control-row"><label>Scale</label><input type="range" id="cams" min="0.1" max="3.0"
                        step="0.01"><span class="val" id="cams-val"></span></div>
                <div class="control-row"><label>Rot°</label><input type="range" id="camr" min="-90" max="90"
                        step="0.5"><span class="val" id="camr-val"></span></div>
                <div class="control-row"><label>Dist</label><input type="range" id="camd" min="0.5" max="8"
                        step="0.1"><span class="val" id="camd-val"></span></div>
            </div>
            <div class="control-section" id="proj-section">
                <h3>Projectors</h3>
                <div id="proj-tabs">
                    <button class="proj-tab" data-i="0"><span class="dot"></span>P1</button>
                    <button class="proj-tab" data-i="1"><span class="dot"></span>P2</button>
                    <button class="proj-tab" data-i="2"><span class="dot"></span>P3</button>
                </div>
                <div class="control-row"><label>Color</label><input type="color" id="pc">
                    <label class="on-label" for="pon">On</label><input type="checkbox" id="pon">
                </div>
                <div class="control-row"><label>Scale</label><input type="range" id="ps" min="0.1" max="1.0"
                        step="0.01"><span class="val" id="ps-val"></span></div>
                <div class="control-row"><label>Rot°</label><input type="range" id="pr" min="-90" max="90"
                        step="0.5"><span class="val" id="pr-val"></span></div>
                <div class="control-row"><label>Dist</label><input type="range" id="pd" min="0.5" max="6"
                        step="0.1"><span class="val" id="pd-val"></span></div>
                <div class="control-row"><label>Bright</label><input type="range" id="pb" min="0" max="3"
                        step="0.05"><span class="val" id="pb-val"></span></div>
            </div>
            <div class="control-section">
                <h3>Brush</h3>
                <div class="control-row"><label>Size</label><input type="range" id="brush" min="0.01" max="0.12"
                        step="0.005"><span class="val" id="brush-val"></span></div>
                <div class="control-row"><label>Color</label><input type="color" id="brush-color"></div>
            </div>
            <div class="control-section">
                <div class="button-row">
                    <button id="clear-btn" class="btn">Clear</button>
                    <button id="seed-btn" class="btn btn-accent">Seed</button>
                    <button id="reset-btn" class="btn btn-accent">Reset</button>
                </div>
                <div class="button-row" style="margin-top:6px">
                    <button id="pause-btn" class="btn">Pause</button>
                    <button id="drift-btn" class="btn">Auto Drift</button>
                    <button id="save-btn" class="btn">Save PNG</button>
                </div>
                <p class="hint">1–5 presets · Space pause · C clear · S seed<br>R reset · D drift · H panel</p>
            </div>
        </div>
        <div id="fps">0 fps</div>
    </div>
    <script type="module" src="feedback.js"></script>
</body>

</html>
