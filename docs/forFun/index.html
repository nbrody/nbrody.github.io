<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nic Brody — For Fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@300;400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --ink: #1a1810;
            --cream: #f5f0e8;
            --warm-white: #faf8f4;
            --accent: #8b4513;
            --accent-light: #c4783a;
            --muted: #7a7060;
            --rule: #d4cfc4;
            --paper: #f0ebe0;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--warm-white);
            color: var(--ink);
            font-family: 'Crimson Pro', Georgia, serif;
            font-size: 18px;
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── NAV ── */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.1rem 3rem;
            background: rgba(250, 248, 244, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--rule);
        }

        .nav-name {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
            font-size: 1.1rem;
            letter-spacing: 0.02em;
            color: var(--ink);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 0.7rem;
            font-weight: 300;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--ink);
        }

        /* ── MAIN ── */
        main {
            flex: 1;
            max-width: 980px;
            width: 100%;
            margin: 0 auto;
            padding: 10rem 3rem 6rem;
        }

        .section-header {
            display: flex;
            align-items: baseline;
            gap: 1.5rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--rule);
        }

        .section-label {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 0.62rem;
            font-weight: 300;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            font-size: 2.6rem;
            color: var(--ink);
            letter-spacing: -0.01em;
        }

        .intro {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #3a3428;
            max-width: 620px;
            margin: 2rem 0 3.5rem;
        }

        .intro em {
            font-style: italic;
            color: var(--muted);
        }

        /* ── GROUPS ── */
        .group {
            margin-top: 3.5rem;
        }

        .group:first-child {
            margin-top: 0;
        }

        .group-title {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            font-size: 1.7rem;
            color: var(--ink);
            letter-spacing: -0.01em;
            margin-bottom: 1.5rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid var(--rule);
        }

        /* ── CARD GRID ── */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--warm-white);
            border: 1px solid var(--rule);
            padding: 1.6rem 1.8rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.07);
            transform: translateY(-2px);
            border-color: var(--accent-light);
        }

        .card-emoji {
            font-size: 1.7rem;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .card-label {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 0.58rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent-light);
        }

        .card-title {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
            font-size: 1.2rem;
            color: var(--ink);
            line-height: 1.3;
        }

        /* ── FOOTER ── */
        footer {
            background: var(--ink);
            color: rgba(245, 240, 232, 0.5);
            padding: 2.5rem 5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'Josefin Sans', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        footer a {
            color: rgba(245, 240, 232, 0.7);
            text-decoration: none;
        }

        footer a:hover {
            color: var(--cream);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 700px) {
            nav {
                padding: 1rem 1.5rem;
            }

            .nav-links {
                gap: 1.5rem;
            }

            main {
                padding: 8rem 1.5rem 4rem;
            }

            footer {
                padding: 2rem 1.5rem;
                flex-direction: column;
                gap: 0.8rem;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a class="nav-name" href="../index.html">Nic Brody</a>
        <ul class="nav-links">
            <li><a href="../index.html#research">Research</a></li>
            <li><a href="../GeometryofLinearGroups/index.html">GOLG</a></li>
            <li><a href="mailto:nic@ucsc.edu">Contact</a></li>
        </ul>
    </nav>

    <main>
        <div class="section-header">
            <span class="section-label">Games &amp; Experiments</span>
            <h1>For Fun</h1>
        </div>

        <p class="intro">
            A scrapbook of small things I&rsquo;ve built outside of research &mdash;
            games, puzzles, and the occasional <em>questionable</em> experiment.
        </p>

        <div id="content">
            <!-- Populated by JS -->
        </div>
    </main>

    <footer>
        <span>Nic Brody &nbsp;·&nbsp; UC Santa Cruz</span>
        <a href="mailto:nic@ucsc.edu">nic@ucsc.edu</a>
    </footer>

    <script>
        const files = [
            { emoji: "🚽", category: "Funny", label: "Satire", name: "Just The Good Sh*t™", path: "justTheGoodShit/index.html" },
            { emoji: "🎬", category: "Funny", label: "Video", name: "Double Feature™", path: "doubleFeature/index.html" },
            { emoji: "🏰", category: "Games", label: "Puzzle Hunt", name: "nicCage Puzzle Hunt", path: "nicCage/index.html" },
            { emoji: "🎮", category: "Games", label: "Games", name: "Kids Games", path: "kidsGames/index.html" },
            { emoji: "🐛", category: "Games", label: "Arcade", name: "Trophallaxis", path: "miscGames/trophallaxis/index.html" },
            { emoji: "🌀", category: "Games", label: "Puzzle", name: "Roadblocks", path: "miscGames/Roadblocks/index.html" },
            { emoji: "🦎", category: "Games", label: "Puzzle", name: "Gecko Out", path: "miscGames/geckoOut/gecko-out-clone.html" },
            { emoji: "🃏", category: "Games", label: "Multiplayer", name: "Card Table", path: "cardGames/index.html" },
            { emoji: "🧩", category: "Games", label: "Strategy", name: "Khet Chess", path: "miscGames/khet/index.html" },
            { emoji: "🕺", category: "Games", label: "Rhythm", name: "OzDDR", path: "ozDDR/index.html" },
            { emoji: "💖", category: "Misc", label: "Personal", name: "Rachie's Valentine", path: "rachie/index.html" },
            { emoji: "🏗️", category: "Misc", label: "Sandbox", name: "Rube Goldberg", path: "rubeGoldberg/index.html" },
            { emoji: "🎡", category: "Misc", label: "Kinetic Sculpture", name: "Perpetual Commotion", path: "ballMachine/index.html" },
            { emoji: "🎨", category: "Misc", label: "Generative", name: "Mosaic Fractal", path: "MosaicFractal/index.html" },
            { emoji: "🕶️", category: "Misc", label: "Experiment", name: "AR Test", path: "ARTest/index.html" }
        ];

        const order = ["Games", "Funny", "Misc"];
        const content = document.getElementById('content');

        order.forEach(cat => {
            const items = files.filter(f => f.category === cat);
            if (!items.length) return;

            const group = document.createElement('section');
            group.className = 'group';

            const title = document.createElement('h2');
            title.className = 'group-title';
            title.textContent = cat;
            group.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'card-grid';
            items.forEach(f => {
                const a = document.createElement('a');
                a.className = 'card';
                a.href = f.path;
                a.innerHTML =
                    `<span class="card-emoji">${f.emoji}</span>` +
                    `<span class="card-label">${f.label}</span>` +
                    `<span class="card-title">${f.name}</span>`;
                grid.appendChild(a);
            });
            group.appendChild(grid);
            content.appendChild(group);
        });
    </script>
</body>

</html>
