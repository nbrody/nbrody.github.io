<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Flip the cards and find all the matching pairs!">
    <title>Memory Match</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <a id="home-btn" class="chrome-btn" href="../index.html" aria-label="Back to all games">🏠</a>
    <button id="sound-btn" class="chrome-btn" type="button" aria-label="Toggle sound">🔊</button>

    <main id="game-screen">
        <header id="hud">
            <div id="hud-solo" class="hud-group">
                <span class="hud-chip">🎯 <span class="lbl">Moves</span> <b id="moves">0</b></span>
                <span class="hud-chip">⭐ <span class="lbl">Pairs</span> <b id="pairs">0/6</b></span>
            </div>
            <div id="hud-duel" class="hud-group" hidden>
                <span class="player-chip p1" id="p1-chip">🍓 P1 <b id="p1-score">0</b></span>
                <span id="turn-banner" class="turn-p1">Player 1's turn!</span>
                <span class="player-chip p2" id="p2-chip">🐳 P2 <b id="p2-score">0</b></span>
            </div>
        </header>
        <div id="board-area">
            <div id="board" aria-label="Memory cards"></div>
        </div>
    </main>

    <div id="menu-overlay" class="overlay show">
        <div class="menu-card">
            <h1 class="game-title">🧠 Memory Match</h1>
            <p class="tagline">Flip two cards and find the pairs!</p>

            <div class="picker-label">Pick a theme</div>
            <div class="picker" id="theme-picker">
                <button type="button" class="pick-btn" data-theme="plush">🧸 Plushies</button>
                <button type="button" class="pick-btn" data-theme="animals">🐾 Animals</button>
                <button type="button" class="pick-btn" data-theme="treats">🍭 Treats</button>
                <button type="button" class="pick-btn" data-theme="space">🚀 Space</button>
            </div>

            <div class="picker-label">How many pairs?</div>
            <div class="picker" id="size-picker">
                <button type="button" class="pick-btn" data-pairs="6">🐣 6 pairs</button>
                <button type="button" class="pick-btn" data-pairs="8">🌟 8 pairs</button>
                <button type="button" class="pick-btn" data-pairs="10">🦖 10 pairs</button>
            </div>

            <div class="picker-label">Players</div>
            <div class="picker" id="mode-picker">
                <button type="button" class="pick-btn" data-mode="solo">🙂 Solo</button>
                <button type="button" class="pick-btn" data-mode="duel">👯 2 Players</button>
            </div>

            <button id="play-btn" class="big-btn" type="button">▶ Play!</button>
        </div>
    </div>

    <div id="win-overlay" class="overlay">
        <div class="menu-card">
            <h2 id="win-title" class="game-title">🎉 You found them all!</h2>
            <div id="win-stats"></div>
            <div class="btn-row">
                <button id="again-btn" class="big-btn" type="button">🔄 Play Again</button>
                <button id="menu-btn" class="big-btn secondary" type="button">📋 Menu</button>
            </div>
        </div>
    </div>

    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <script src="game.js"></script>
</body>

</html>
