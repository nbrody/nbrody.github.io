<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Rockstar! A music toy for kids — drums, piano, xylophone and guitar.">
    <title>Rockstar!</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Pastel background blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <!-- Disco glow (pulses with note activity) -->
    <div id="disco-glow"></div>

    <!-- Floating chrome -->
    <a id="home-btn" class="chrome-btn" href="../index.html" aria-label="Back to games">🏠</a>
    <button id="sound-btn" class="chrome-btn" aria-label="Sound on or off">🔊</button>

    <main id="app">
        <header id="top-bar">
            <h1 id="game-title">Rockstar<span class="title-mic">🎤</span></h1>
            <nav id="tabs" aria-label="Instruments">
                <button class="tab" data-inst="drums" aria-label="Drums"><span class="tab-emoji">🥁</span><span
                        class="tab-name">Drums</span></button>
                <button class="tab" data-inst="piano" aria-label="Piano"><span class="tab-emoji">🎹</span><span
                        class="tab-name">Piano</span></button>
                <button class="tab" data-inst="xylo" aria-label="Xylophone"><span class="tab-emoji">🎼</span><span
                        class="tab-name">Xylo</span></button>
                <button class="tab" data-inst="guitar" aria-label="Guitar"><span class="tab-emoji">🎸</span><span
                        class="tab-name">Guitar</span></button>
            </nav>
            <div id="extras">
                <button id="metro-btn" class="pill-btn" aria-label="Metronome on or off">⏱<span
                        class="pill-label">90</span></button>
                <button id="hints-btn" class="pill-btn" aria-label="Show keyboard hints">⌨️<span
                        class="pill-label">abc</span></button>
            </div>
        </header>

        <section id="stage">
            <!-- 🥁 Drums -->
            <div class="panel" id="panel-drums">
                <div id="drum-kit" class="instrument-surface"></div>
            </div>

            <!-- 🎹 Piano -->
            <div class="panel" id="panel-piano">
                <div id="piano-wrap">
                    <div id="piano" class="instrument-surface"></div>
                </div>
            </div>

            <!-- 🎼 Xylophone -->
            <div class="panel" id="panel-xylo">
                <div id="xylo" class="instrument-surface">
                    <div class="xylo-rail xylo-rail-top"></div>
                    <div class="xylo-rail xylo-rail-bot"></div>
                    <div id="xylo-bars"></div>
                </div>
            </div>

            <!-- 🎸 Guitar -->
            <div class="panel" id="panel-guitar">
                <div id="chord-row" aria-label="Chords"></div>
                <div id="guitar-body">
                    <div class="sound-hole"></div>
                    <div id="strings" class="instrument-surface"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Sparkles, floating notes -->
    <canvas id="fx-canvas"></canvas>

    <script src="game.js"></script>
</body>

</html>
