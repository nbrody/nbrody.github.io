<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Pop the balloons! Free pop, numbers and letters modes.">
    <title>Balloon Pop</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <a id="home-btn" class="chrome-btn" href="../index.html" aria-label="Back to all games">🏠</a>
    <button id="sound-btn" class="chrome-btn" type="button" aria-label="Toggle sound">🔊</button>
    <button id="back-btn" class="chrome-btn" type="button" aria-label="Back to menu" hidden>📋</button>

    <main id="game-screen">
        <header id="hud">
            <span id="pop-chip" class="hud-chip" hidden>🎈 <b id="pop-count">0</b></span>
            <div id="target-chip" class="hud-chip target" hidden>
                Pop the <b id="target-label">4</b>!
                <button id="say-btn" type="button" aria-label="Say it again">🗣️</button>
            </div>
        </header>
        <canvas id="game-canvas"></canvas>
    </main>

    <div id="menu-overlay" class="overlay show">
        <div class="menu-card">
            <h1 class="game-title">🎈 Balloon Pop</h1>
            <p class="tagline">Tap the balloons to pop them!</p>

            <div class="picker-label">Pick a game</div>
            <div class="picker mode-picker" id="mode-picker">
                <button type="button" class="pick-btn" data-mode="free">🎈 Free Pop</button>
                <button type="button" class="pick-btn" data-mode="numbers">🔢 Numbers</button>
                <button type="button" class="pick-btn" data-mode="letters">🔤 Letters</button>
            </div>

            <button id="play-btn" class="big-btn" type="button">▶ Play!</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>

</html>
