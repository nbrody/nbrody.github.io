<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Watch the colors, then repeat the pattern!">
    <title>Simon</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <a id="home-btn" class="chrome-btn" href="../index.html" aria-label="Back to all games">🏠</a>
    <button id="sound-btn" class="chrome-btn" type="button" aria-label="Toggle sound">🔊</button>

    <main id="game-screen">
        <header id="hud">
            <span id="status-line">Watch… 👀</span>
            <span id="life-chip" class="hud-chip">❤️ Second chance ready</span>
        </header>
        <div id="board-area">
            <div id="wheel">
                <button type="button" class="pad pad-0" data-pad="0" aria-label="Coral pad"></button>
                <button type="button" class="pad pad-1" data-pad="1" aria-label="Teal pad"></button>
                <button type="button" class="pad pad-2" data-pad="2" aria-label="Yellow pad"></button>
                <button type="button" class="pad pad-3" data-pad="3" aria-label="Purple pad"></button>
                <div id="center">
                    <div id="round-num">1</div>
                    <div id="round-lbl">round</div>
                </div>
            </div>
        </div>
    </main>

    <div id="menu-overlay" class="overlay show">
        <div class="menu-card">
            <h1 class="game-title">🌈 Simon</h1>
            <p class="tagline">Watch the pattern, then tap it back!</p>
            <div id="best-line">Best: <b id="menu-best">–</b> rounds</div>
            <button id="play-btn" class="big-btn" type="button">▶ Play!</button>
        </div>
    </div>

    <div id="end-overlay" class="overlay">
        <div class="menu-card">
            <h2 id="end-title" class="game-title">🌟 Great memory!</h2>
            <div id="end-stats"></div>
            <div class="btn-row">
                <button id="again-btn" class="big-btn" type="button">🔄 Try Again</button>
                <button id="menu-btn" class="big-btn secondary" type="button">📋 Menu</button>
            </div>
        </div>
    </div>

    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <script src="game.js"></script>
</body>

</html>
