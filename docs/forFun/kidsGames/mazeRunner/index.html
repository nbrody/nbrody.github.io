<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Hop through cute mazes, collect stars and find the flag!">
    <title>Maze Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <a id="home-btn" class="chrome-btn" href="../index.html" aria-label="Back to all games">🏠</a>
    <button id="sound-btn" class="chrome-btn" type="button" aria-label="Toggle sound">🔊</button>

    <main id="game-screen">
        <header id="hud">
            <span class="hud-chip">🗺️ Level <b id="level-num">1</b></span>
            <span class="hud-chip">⭐ <b id="star-count">0</b>/3</span>
        </header>
        <div id="board-area">
            <canvas id="maze-canvas"></canvas>
        </div>
        <div id="dpad" aria-hidden="true">
            <button class="dpad-btn up" data-dir="up" type="button">▲</button>
            <button class="dpad-btn left" data-dir="left" type="button">◀</button>
            <button class="dpad-btn right" data-dir="right" type="button">▶</button>
            <button class="dpad-btn down" data-dir="down" type="button">▼</button>
        </div>
    </main>

    <div id="menu-overlay" class="overlay show">
        <div class="menu-card">
            <h1 class="game-title">🗺️ Maze Explorer</h1>
            <p class="tagline">Hop to the flag and grab the stars!</p>

            <div class="picker-label">Pick your explorer</div>
            <div class="picker" id="char-picker">
                <button type="button" class="pick-btn char" data-char="🐰">🐰</button>
                <button type="button" class="pick-btn char" data-char="🐢">🐢</button>
                <button type="button" class="pick-btn char" data-char="🐱">🐱</button>
                <button type="button" class="pick-btn char" data-char="🦊">🦊</button>
            </div>

            <p id="progress-line">⭐ 0 stars · best level 1</p>

            <div class="btn-row">
                <button id="continue-btn" class="big-btn" type="button">▶ Play!</button>
                <button id="restart-btn" class="big-btn secondary" type="button" hidden>🌱 Start Over</button>
            </div>
        </div>
    </div>

    <div id="win-overlay" class="overlay">
        <div class="menu-card">
            <h2 class="game-title">🎉 Level complete!</h2>
            <div id="win-stars">⭐⭐⭐</div>
            <div class="btn-row">
                <button id="next-btn" class="big-btn" type="button">▶ Next Level</button>
                <button id="menu-btn" class="big-btn secondary" type="button">📋 Menu</button>
            </div>
        </div>
    </div>

    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <script src="game.js"></script>
</body>

</html>
