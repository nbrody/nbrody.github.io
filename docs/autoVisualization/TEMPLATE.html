<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chords of a Circle · AutoViz</title>
<link rel="stylesheet" href="../kit/av.css">
</head>
<body>
<!--
  AutoViz page template. Copy to days/YYYY-MM-DD-<slug>.html (the ../kit/ paths assume days/),
  then replace the placeholder mathematics (all chords of n points on a circle) with today's.
  Load only the kit modules you use; see kit/README.md for the API and kit/examples/ for
  split panes + charts, 3D, and WebGL pages.
-->
<script src="../kit/av.js"></script>
<script src="../kit/draw.js"></script>
<!--
<script src="../kit/plot.js"></script>        charts inside a pane
<script src="../kit/linalg.js"></script>      AV.la: matrices, eigenvectors, frames in ℝⁿ
<script src="../kit/exact.js"></script>       AV.ex, AV.Q: BigInt, rationals, SL₂(ℤ), continued fractions
<script src="../kit/complex.js"></script>     AV.cx, AV.mob: complex numbers, Möbius maps
<script src="../kit/hyperbolic.js"></script>  AV.hyp: Poincaré disk + upper half-plane (after complex.js)
<script src="../kit/space3d.js"></script>     AV.orbit3d: curves and points in space
<script src="../kit/gl.js"></script>          AV.gl: WebGL2 (stage: 'webgl2')
<link rel="stylesheet" href="../kit/vendor/katex/katex.min.css">   (in <head>) + the two scripts below for any formula:
<script src="../kit/vendor/katex/katex.min.js"></script>
<script src="../kit/tex.js"></script>         AV.tex / AV.texify / AV.texLabels: typeset mathematics
-->
<script>
'use strict';

/* ---------- mathematics: pure functions, no drawing ---------- */

const pointsOnCircle = n => Array.from({ length: n }, (_, k) => [Math.cos(2 * Math.PI * k / n - Math.PI / 2), Math.sin(2 * Math.PI * k / n - Math.PI / 2)]);
const chords = n => { const out = []; for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) out.push([i, j]); return out; };

/* ---------- state ---------- */

let geom = { x: 0, y: 0, r: 100 };   // where the picture lives, recomputed on resize
let spin = 0;                        // animated by step() while playing
let highlight = -1;                  // a tapped point

/* ---------- drawing ---------- */

function draw(app) {
  const ctx = app.ctx, n = app.get('n');
  AV.clear(app);
  const P = pointsOnCircle(n).map(([x, y]) => {
    const c = Math.cos(spin), s = Math.sin(spin);
    return [geom.x + geom.r * (c * x - s * y), geom.y + geom.r * (s * x + c * y)];
  });
  ctx.globalCompositeOperation = 'lighter';
  for (const [i, j] of chords(n)) {
    const on = i === highlight || j === highlight;
    AV.line(ctx, P[i][0], P[i][1], P[j][0], P[j][1], on ? AV.C.accent : AV.rgba(AV.ramp(Math.abs(i - j) / n), 0.35), on ? 1.4 : 0.8);
  }
  ctx.globalCompositeOperation = 'source-over';
  P.forEach((p, i) => AV.dot(ctx, p[0], p[1], i === highlight ? 5 : 3, i === highlight ? AV.C.ink : AV.C.accent, { glow: i === highlight ? 4 : 0 }));

  // the live check: recomputed every draw, ✓/✗ from AV.ok
  const count = chords(n).length;
  app.readout('<span class="big">' + n + ' points</span><br>chords = ' + count + ' = C(' + n + ', 2) ' + AV.ok(count === n * (n - 1) / 2));
}

/* ---------- the page ---------- */

const app = AV.page({
  title: 'Chords of a Circle',
  hook: 'Join every pair of n points on a circle and count the chords.',
  date: 'YYYY-MM-DD',
  credit: 'generated by Claude',
  hint: 'tap a point',
  controls: [
    { type: 'play' },
    { type: 'slider', id: 'n', label: 'n', min: 3, max: 24, step: 1, value: 7, format: v => String(v) },
  ],
  tour: [
    { text: 'Seven points on a circle, every pair joined by a chord.',
      enter: a => { a.pause(); a.set('n', 7); highlight = -1; } },
    { text: 'Tap a point: it meets the other <i>n</i> − 1, and each chord is counted from both ends.',
      enter: a => { highlight = 0; a.pause(); } },
    { text: 'Slide <i>n</i>: there are always <i>n</i>(<i>n</i> − 1)/2 chords, one for each pair.',
      enter: a => { a.pulse('n'); a.play(); a.tween(1800, u => a.set('n', Math.round(7 + 9 * u))); } },
  ],
  math: `<p>A set of <i>n</i> points has <b>C(<i>n</i>, 2) = <i>n</i>(<i>n</i> − 1)/2</b> unordered pairs: each point lies on
    <i>n</i> − 1 chords and every chord has two ends, so the double count gives <i>n</i>(<i>n</i> − 1) = 2 · #chords.</p>
    <p class="ref">Template page — replace with today's mathematics.</p>`,
  step: dt => { spin += dt * 0.15; },
  draw,
});

app.onResize(a => { geom = a.fitCircle(16); });

app.pointer({
  tap: p => {
    const n = app.get('n'), P = pointsOnCircle(n);
    let best = -1, bd = 22;
    P.forEach(([x, y], i) => {
      const c = Math.cos(spin), s = Math.sin(spin);
      const d = Math.hypot(geom.x + geom.r * (c * x - s * y) - p.x, geom.y + geom.r * (s * x + c * y) - p.y);
      if (d < bd) { bd = d; best = i; }
    });
    highlight = best;
  },
});

/* ---------- self-checks: known facts, run on every load ---------- */

AV.test('chords(n) = n(n−1)/2 for n ≤ 40', () => {
  for (let n = 1; n <= 40; n++) if (chords(n).length !== n * (n - 1) / 2) return 'fails at n = ' + n;
  return true;
});
</script>
</body>
</html>
