/* ---------- mathematics: the ring O = ℤ[ω] of an imaginary quadratic field ----------
   ω = √−d (d ≡ 1, 2 mod 4) or (1 + √−d)/2 (d ≡ 3 mod 4); an element is [x, y] = x + yω.
   Over every fraction λ/μ with (λ, μ) = O sits a hemisphere of radius 1/|μ| in ℍ³ (the isometric
   sphere of a matrix of SL₂(O) with bottom row (μ, −λ)). A point s = λ'/μ' strictly under it is

const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };

    conj: a => [a[0] + a[1] * t, -a[1]],
    norm: a => a[0] * a[0] + t * a[0] * a[1] + n * a[1] * a[1],
    toC: a => [a[0] + a[1] * wRe, a[1] * wIm],                         // lattice coordinates → ℂ

// Index of the ideal (λ, μ) in O: the gcd of the 2×2 minors of its ℤ-generators λ, λω, μ, μω.
function idealIndex(K, l, m) {

  return { key: 'inf', x: c2.X(w0[0]) + 9, y: c2.Y(w0[1]) - 1, tex: '\\infty', align: 'left', size: 11.5, color: AV.C.ink2 };
}

/* ---------- drawing ---------- */

function draw(a) {
  const K = scene.K, o = a.octx;
  if (!K) return;
  const cs = sel < K.h ? sel : -1;            // a class chosen for a field that is still on its way in
  const V = view();
  renderFloor(V);
  const lab = [];

  // a ring and a name on the nearest pit of the selected class
  if (cs > 0 && scene.all > 0.5) {
    let best = null, at = [geom.x, geom.y];
    if (marble && marble.end === 'pit') { const q = project(V, marble.pts[marble.pts.length - 1]); if (q) at = q; }
    for (const p of visiblePits(V)) {
      if (p.s.cls !== cs) continue;
      const dd = Math.hypot(p.x - at[0], p.y - at[1]);
      if (!best || dd < best.dd) best = { dd, p };
    }
    if (best) {
      const p = best.p, rad = AV.clamp(0.11 * V.k / p.zc, 8, 26);
      o.save(); o.translate(p.x, p.y); o.scale(1, Math.max(0.35, Math.sin(cam.pitch)));
      AV.ring(o, 0, 0, rad, AV.rgba(CLASS_COL[cs], 0.9), 1.4);
      o.restore();
      if (!marble) lab.push({ key: 'pit', x: p.x, y: p.y - rad - 9, valign: 'bottom', tex: big(fracTex(K, [p.s.x + p.s.N * p.ku, p.s.y + p.s.N * p.kv], [p.s.N, 0])), color: CLASS_COL[cs], size: 14 });
    }
  }

  // the marble and its trail
  if (marble && scene.all > 0.5) {
    const m = marble, col = m.end === 'inf' ? AV.C.ink : m.end === 'pit' ? CLASS_COL[m.pit.cls] : AV.C.rose;
    const trail = [];
    for (let s = 0; s <= m.T + 1e-9; s += 1 / 14) { const p = project(V, marbleAt(m, Math.min(s, m.T))); if (p) trail.push([p[0], p[1]]); }
    AV.polyline(o, trail, { color: AV.rgba(col, 0.8), width: 1.8 });
    m.pts.forEach((P, i) => { if (m.T >= i + 1) { const p = project(V, P); if (p) AV.dot(o, p[0], p[1], 2.6, col); } });
    const flown = m.end === 'inf' && m.T >= m.segs - 1 ? AV.clamp(m.T - (m.segs - 1), 0, 1) : 0;
    const p = project(V, marbleAt(m, m.T));
    if (p && flown < 1) { o.globalAlpha = 1 - flown; AV.dot(o, p[0], p[1], 5.5, col, { glow: 4 }); o.globalAlpha = 1; }
    const p0 = project(V, [m.pts[0][0], m.pts[0][1], m.pts[0][2]]);
    if (p0) lab.push({ key: 'start', x: p0[0], y: p0[1] + 11, valign: 'top', tex: big(m.tex), size: 13.5 });
  }

  lab.push(drawClasses(o, cs));
  labels.set(lab);

  // the live checks
  const st = scene.stats;
  let h = '<span class="big">' + T(fieldTex(K)) + '</span>' +
    '<br><span class="k">pit classes</span> ' + K.pitClasses + ' <span class="k">+ 1 =</span> ' + T('h') + ' <span class="k">=</span> ' + K.h + ' ' + AV.ok(K.pitClasses + 1 === K.h) +
    '<br><span class="k">gaps with no pit</span> ' + st.pitless + ' ' + AV.ok(st.pitless === 0);
  if (marble) {
    let ns = marble.norms.slice();
    if (ns.length > 6) ns = [...ns.slice(0, 3), '\\cdots', ...ns.slice(-2)];
    h += '<br><span class="k">remainders</span> ' + T(ns.join('\\to ') + (marble.end === 'inf' ? '\\to 0' : '')) +
      '<br>' + (marble.end === 'inf' ? '<span class="k">a gcd: the ideal is principal</span> ' + AV.ok(marble.ok)
        : marble.end === 'pit' ? '<span class="k">no gcd: a pit of its own class</span> ' + AV.ok(marble.ok)
        : '<span class="k">stuck: no dome above</span> ' + AV.ok(false));
  }
  if (cs >= 0) {
    const s = K.sing.find(q => q.cls === cs);
    h += '<br>' + T((s ? '\\left(' + s.N + ',\\ ' + elemTex(K, [s.x, s.y]) + '\\right)' : '(1)') + '\\ \\leftrightarrow\\ ' + formTex(K.forms[cs]));
  }
  a.readout(h);
}

/* ---------- the page ---------- */

const tx = AV.texify;
function scene3(a, d, depth, tilt) {                       // a tour step's starting state
  clearMarble(); queued = null; sel = -1; hands = false;
  a.pause();
  a.set('field', FIELDS.indexOf(d));
  a.set('depth', depth);
  a.set('tilt', tilt);
}
const wide = s => '<span style="display:inline-block;min-width:' + s + 'em">';

app = AV.page({
  title: "Where Euclid's Algorithm Gets Stuck",
  hook: 'Domes over a ring of integers leave pits exactly where unique factorization fails.',
  date: '2026-11-09',
  credit: 'generated by Claude (Fable 5)',
  hint: 'tap to drop a marble · drag to tilt',
  stage: 'webgl2',
  glOptions: { antialias: false, preserveDrawingBuffer: true },
  edgeScrim: true,
  autoplay: false,
  posterStep: 2,
  posterDelay: 5200,
  controls: [
    { type: 'play' },
    { type: 'slider', id: 'field', label: '', min: 0, max: FIELDS.length - 1, step: 1, value: 0,
      format: v => wide(4.9) + T(fieldTex({ d: FIELDS[v] })) + '</span>', onChange: () => retarget() },
    { type: 'slider', id: 'depth', label: 'domes', min: 1, max: MMAX, step: 1, value: 1,
      format: v => wide(4.3) + T('|\\mu|^2\\le ' + v) + '</span>', onChange: () => retarget() },
    { type: 'toggle', id: 'tilt', label: 'tilt', value: true,
      onChange: v => { const p0 = cam.pitch, y0 = cam.yaw, p1 = v ? 0.98 : Math.PI / 2, y1 = v ? 0.42 : 0;
        glTween(900, t => { cam.pitch = AV.lerp(p0, p1, t); cam.yaw = AV.lerp(y0, y1, t); }, { key: 'angle' }); } },
  ],
  tour: [
    { text: tx("Over the Gaussian integers, a unit dome on every lattice point roofs the plane. Tap anywhere: Euclid's algorithm hops out to $\\infty$."),
      enter: a => { scene3(a, 1, 1, true); a.after(1500, () => dropFor(1, [1, 5], [12, 0])); } },
    { text: tx('In $\\mathbb{Q}(\\sqrt{-19})$ unit domes leave gaps, and a marble dropped there is stuck. Smaller domes over fractions $\\lambda/\\mu$ plug every gap.'),
      enter: a => { scene3(a, 19, 1, true); a.after(1500, () => dropFor(19, [1, 1], [2, 0])); a.after(3600, () => { a.pulse('depth'); a.set('depth', 7); }); } },
    { text: tx('In $\\mathbb{Q}(\\sqrt{-5})$ one pit never fills, however small the domes. Marbles that roll in are stuck for good: the pit is a cusp.'),
      enter: a => { scene3(a, 5, 21, true); a.after(1700, () => dropFor(5, [3, 5], [12, 0])); } },
    { text: tx('A pit $\\lambda/\\mu$ is an ideal $(\\lambda,\\mu)$ that no single number generates. Its lattice shape is a point of the modular surface.'),
      enter: a => { scene3(a, 23, 24, false); let k = 0; sel = 1; a.every(2200, () => { if (hands) return; k++; sel = 1 + k % 2; a.redraw(); }); } },
    { text: tx('Pits, plus the cusp at $\\infty$, always count the class number. Slide through the fields; drag to tilt, tap to drop a marble.'),
      enter: a => { scene3(a, 14, 1, true); a.pulse('field'); a.after(900, () => a.play()); } },
  ],
  math: tx(`<p>Let $\\mathcal{O}$ be the integers of $\\mathbb{Q}(\\sqrt{-d})$. Over each fraction $\\lambda/\\mu$ with $(\\lambda,\\mu)=\\mathcal{O}$ sits a hemisphere of radius $1/|\\mu|$,
    an isometric sphere of the <b>Bianchi group</b> $\\mathrm{PSL}_2(\\mathcal{O})$ acting on $\\mathbb{H}^3$. A point under a dome moves to one with a smaller denominator: a step of Euclid's algorithm.
    Unit domes alone roof the plane exactly for $d=1,2,3,7,11$.</p>
    <p>The points under no dome are the <b>singular points</b>. With $\\infty$ they give the cusps of $\\mathbb{H}^3/\\mathrm{PSL}_2(\\mathcal{O})$, one for each ideal class.
    A class is also a lattice shape: the root of its reduced form $ax^2+bxy+cy^2$ in the modular domain.</p>
    <p class="ref">Bianchi 1892; Hurwitz 1892; Swan 1971; Gauss, <i>Disquisitiones</i> 1801.</p>`),
  setup: a => {
    const gl = a.gl;
    app = a;
    if (!gl) return;                                      // no WebGL2: the page stays dark but does not throw
    G.prog = AV.gl.program(gl, null, FS);
    G.blit = AV.gl.program(gl, null, BLIT);
    G.quad = AV.gl.quad(gl);
    G.texA = newMapTex(gl); G.texB = newMapTex(gl); G.sph = newMapTex(gl);
    G.fboTex = AV.gl.texture(gl, 2, 2, null, { filter: 'linear' });
    G.fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, G.fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, G.fboTex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    labels = AV.texLabels(a);
    loadField(FIELDS[a.get('field')], a.get('depth'), true);
    glTween(900, t => { scene.all = t; }, { key: 'field', ease: 'out' }).then(ok => { if (ok) settled(); });
  },
  // play: the domes arrive in order of size, hold, and start again
  step: (dt, a) => {
    if (motion > 0 || !scene.K || scene.K.d !== FIELDS[a.get('field')]) return;
    playT += dt;
    const K = scene.K, top = K.levels[K.levels.length - 1];
    if (scene.level >= top) { if (playT > 3.2) { playT = 0; a.set('depth', 1); } return; }
    if (playT > 0.5) { playT = 0; a.set('depth', K.levels[K.levels.indexOf(scene.level) + 1]); }
  },
  draw,
});
let playT = 0;

app.onResize(a => {
  G.key = '';                      // a resize clears the canvas, even at the same size: force the next GL draw
  geom = a.mode === 'full' ? a.fitCircle(0) : { x: a.W / 2, y: a.H / 2, r: Math.min(a.W, a.H) * 0.42 };
  const pad = a.W <= 760 ? 14 : 22;
  let y0 = 0, y1 = a.H;
  if (a.mode === 'full') { y0 = a.el.top.getBoundingClientRect().bottom; y1 = a.el.bottom.getBoundingClientRect().top; }
  const r = AV.clamp(Math.min((y1 - y0) / 2 - 34, a.W * (a.mode === 'full' ? 0.11 : 0.085)), 30, 96);
  inset = a.mode === 'full' ? { x: a.W - pad - r - 10, y: (y0 + y1) / 2 + 8, r } : { x: a.W - r - 22, y: a.H - r - 22, r };
});

let grab = null;
app.pointer({
  down: p => { hands = true; grab = Math.hypot(p.x - inset.x, p.y - inset.y) < inset.r + 10 ? null : { yaw: cam.yaw, pitch: cam.pitch }; },
  drag: (p, d) => {
    if (!grab) return;
    dragging = true;
    cam.yaw += d.dx * 0.006;
    cam.pitch = AV.clamp(cam.pitch + d.dy * 0.005, 0.62, Math.PI / 2);
  },
  up: () => { dragging = false; },
  wheel: (p, dy) => { cam.Rw = AV.clamp(cam.Rw * Math.exp(dy * 0.0012), 0.8, 7); wheelT = app.time; setTimeout(() => app.redraw(), 300); },
  tap: p => {
    const K = scene.K;
    if (!K || scene.all < 0.99) return;
    if (Math.hypot(p.x - inset.x, p.y - inset.y) < inset.r + 10) {            // pick an ideal class
      const c2 = AV.camera().fit(-1, 1, -1, 1, { x: inset.x - inset.r, y: inset.y - inset.r, w: 2 * inset.r, h: 2 * inset.r });
      let best = -1, bd = 26;
      K.forms.forEach((f, i) => { const w = classPoint(K, f), dd = Math.hypot(c2.X(w[0]) - p.x, c2.Y(w[1]) - p.y); if (dd < bd) { bd = dd; best = i; } });
      clearMarble();
      sel = best === sel ? -1 : best;
      return;
    }
    const V = view();
    let pit = null, bd = 18;
    for (const q of visiblePits(V)) { const dd = Math.hypot(q.x - p.x, q.y - p.y); if (dd < bd) { bd = dd; pit = q; } }
    if (pit) { dropMarble([pit.s.x + pit.s.N * pit.ku, pit.s.y + pit.s.N * pit.kv], [pit.s.N, 0]); return; }
    const w = pick(V, p.x, p.y);
    if (!w) return;
    const L = K.lat(w);
    sel = -1;
    dropMarble([Math.round(L[0] * 12), Math.round(L[1] * 12)], [12, 0]);     // the nearest twelfth
  },
});
app.cursor('grab');

/* ---------- self-checks ---------- */

AV.test('class numbers by Gauss reduction match the table', () => {
  for (const d of FIELDS) { const K = fieldData(d); if (K.h !== CLASS_NUMBER[d]) return 'h(' + K.D + ') = ' + K.h; }
  return true;
});
AV.test('pit classes + 1 = class number, for all 21 fields', () => {
  for (const d of FIELDS) { const K = fieldData(d); if (K.pitClasses + 1 !== K.h || K.sing.some(s => s.cls <= 0)) return 'fails for d = ' + d; }
  return true;
});
AV.test('no dome with |μ|² ≤ 50 covers a pit (exact)', () => {
  for (const d of FIELDS) {
    const K = fieldData(d);
    if (!K.sing.length) continue;
    const F = makeFloor(K, 16); F.count = K.hems.length;                  // empty raster: forces the exhaustive exact scan
    for (const s of K.sing) if (domeOver(F, s.x, s.y, s.N)) return 'covered pit for d = ' + d;
  }
  return true;
});
AV.test('unit domes roof the plane exactly for d = 1, 2, 3, 7, 11; d = 19 needs |μ|² ≤ 4', () => {
  for (const d of FIELDS) {
    const K = fieldData(d), F = addDomes(makeFloor(K, 96), K.countAt(1));
    const open = F.ids.some(k => k < 0);
    if (open === [1, 2, 3, 7, 11].includes(d)) return 'd = ' + d + (open ? ' has a gap' : ' is roofed');
  }
  const K = fieldData(19);
  return !addDomes(makeFloor(K, 96), K.countAt(4)).ids.some(k => k < 0) || 'd = 19 still open';
});
AV.test("Euclid's descent finds the ideal class of every twelfth (d = 1, 5, 14, 19, 23)", () => {
  for (const d of [1, 5, 14, 19, 23]) {
    const K = fieldData(d), F = addDomes(makeFloor(K, 96), K.hems.length);
    for (let x = 0; x < 12; x++) for (let y = 0; y < 12; y++) {
      const g = gcd(gcd(x, y), 12), lam = [x / g, y / g], mu = [12 / g, 0];
      const cls = K.classOf(idealForm(K, lam, mu).form), r = descend(F, lam, mu, K.toC([x / 12, y / 12]));
      for (let i = 1; i < r.chain.length; i++) if (r.chain[i].N >= r.chain[i - 1].N) return 'remainders do not decrease';
      if (r.end === 'gap' || (r.end === 'inf') !== (cls === 0) || (r.end === 'pit' && r.pit.cls !== cls)) return 'd = ' + d + ', s = (' + x + ' + ' + y + 'ω)/12: ' + r.end + ', class ' + cls;
    }
  }
  return true;
});
</script>
</body>
