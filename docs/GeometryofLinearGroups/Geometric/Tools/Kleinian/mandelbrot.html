<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mandelbrot &amp; Julia Explorer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="vendor/mathquill/build/mathquill.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="vendor/jquery/jquery-3.7.1.min.js"></script>
<script src="vendor/mathquill/build/mathquill.min.js"></script>
<style>
/* Layout: the parameter plane fills the window as one WebGL picture; a glass panel docks
   right (a bottom sheet on phones) with the point readout, its Julia set, landmarks,
   view and color controls. Single dark look, after the poincare panel. */
:root {
  --bg: #04060d;
  --ink: #eef1f8;
  --ink-dim: #a3adc4;
  --ink-faint: #6c768f;
  --accent: #818cf8;
  --warm: #ffb547;
  --glass: rgba(9, 13, 25, 0.84);
  --field: rgba(0, 0, 0, 0.28);
  --w05: rgba(255, 255, 255, 0.05);
  --w08: rgba(255, 255, 255, 0.08);
  --w12: rgba(255, 255, 255, 0.12);
  --hairline: rgba(255, 255, 255, 0.08);
  --hairline-strong: rgba(255, 255, 255, 0.16);
  --accent-soft: rgba(129, 140, 248, 0.16);
  --accent-line: rgba(129, 140, 248, 0.55);
  --accent-glow: rgba(129, 140, 248, 0.28);
  --glass-edge: linear-gradient(165deg, rgba(255,255,255,0.22), rgba(255,255,255,0.05) 30%, rgba(129,140,248,0.30) 90%);
  --shadow: 0 24px 60px -16px rgba(0,0,0,0.65), 0 4px 16px rgba(0,0,0,0.35);
  --font: KaTeX_Main, "Latin Modern Roman", "CMU Serif", "Times New Roman", serif;
  --r-sm: 8px;
  --r-md: 10px;
  --r-xl: 18px;
  --panel-w: 360px;
  --gap: 16px;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.4;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.katex { font-size: 1.06em; }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent-line); outline-offset: 2px; }

/* ---------- picture ---------- */
#stage { position: fixed; inset: 0; touch-action: none; cursor: crosshair; background: var(--bg); }
#stage.dragging { cursor: grabbing; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#overlay { pointer-events: none; }
#progress {
  position: fixed; top: 0; left: 0; height: 2px; width: 0;
  background: linear-gradient(90deg, var(--accent), var(--warm));
  opacity: 0; transition: opacity 0.3s ease; z-index: 50; pointer-events: none;
}
#progress.on { opacity: 0.9; }

#hud {
  position: fixed;
  left: max(var(--gap), env(safe-area-inset-left, 0px));
  bottom: calc(var(--gap) + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  padding: 7px 10px 8px;
  border-radius: var(--r-md);
  background: rgba(4, 6, 13, 0.55);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--hairline);
  pointer-events: none;
  font-size: 13px;
  color: var(--ink);
}
#scalebar {
  height: 6px;
  border: 1.5px solid var(--ink);
  border-top: none;
  min-width: 10px;
}

/* ---------- glass panel ---------- */
#control-panel {
  position: fixed;
  top: calc(var(--gap) + env(safe-area-inset-top, 0px));
  right: max(var(--gap), env(safe-area-inset-right, 0px));
  width: var(--panel-w);
  max-height: calc(100% - 2 * var(--gap) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  z-index: 100;
  display: flex; flex-direction: column;
  overflow: hidden;
  border-radius: var(--r-xl);
  border: 1px solid transparent;
  background: linear-gradient(var(--glass), var(--glass)) padding-box, var(--glass-edge) border-box;
  backdrop-filter: blur(24px) saturate(1.25);
  -webkit-backdrop-filter: blur(24px) saturate(1.25);
  box-shadow: var(--shadow);
  transition: width 0.45s var(--ease-out), max-height 0.45s var(--ease-out), border-radius 0.45s var(--ease-out);
}
.panel-head {
  display: flex; align-items: center; gap: 6px;
  padding: 10px 12px 10px 16px;
  background: rgba(0, 0, 0, 0.25);
  border-bottom: 1px solid var(--hairline);
  flex-shrink: 0;
}
.panel-name { flex: 1; min-width: 0; font-size: 17px; font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  width: 30px; height: 30px; min-width: 30px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--w05); border: 1px solid var(--hairline); border-radius: 50%;
  color: var(--ink-dim); cursor: pointer; flex-shrink: 0;
  transition: color 0.15s ease, background 0.2s ease, border-color 0.2s ease;
}
.icon-btn:hover { color: var(--ink); background: var(--w08); border-color: var(--hairline-strong); }
.icon-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#collapse-btn svg { transition: transform 0.45s var(--ease-out); }
#control-panel.collapsed { width: 52px; max-height: 52px; border-radius: 26px; }
#control-panel.collapsed .panel-head { padding: 10px; background: transparent; border-bottom: none; }
#control-panel.collapsed .panel-head > :not(#collapse-btn), #control-panel.collapsed .panel-content { display: none; }
#control-panel.collapsed #collapse-btn svg { transform: rotate(45deg); }

.panel-content {
  overflow-y: auto; overscroll-behavior: contain;
  scrollbar-width: thin; scrollbar-color: var(--w12) transparent;
}
.panel-content::-webkit-scrollbar { width: 5px; }
.panel-content::-webkit-scrollbar-thumb { background: var(--w12); border-radius: 999px; }
.sec { padding: 14px 16px 16px; display: grid; gap: 10px; }
.sec + .sec { border-top: 1px solid var(--hairline); }
.sec-head { display: flex; align-items: center; gap: 8px; }
.sec-title {
  flex: 1; margin: 0;
  font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--ink-faint);
}
.intro { color: var(--ink-dim); font-size: 14.5px; }
.intro .def { color: var(--ink); text-align: center; padding: 2px 0 4px; overflow-x: auto; }
.chip {
  font-size: 11.5px; letter-spacing: 0.04em; padding: 1px 9px; border-radius: 999px;
  border: 1px solid var(--hairline-strong); color: var(--ink-dim);
}
.chip.pinned { border-color: rgba(255, 181, 71, 0.55); color: var(--warm); }
.chip.pointer { border-color: var(--accent-line); color: var(--ink); }

.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; align-items: baseline; }
.kv .k { color: var(--ink-dim); font-size: 14px; }
.kv .v { min-width: 0; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
.kv .v::-webkit-scrollbar { display: none; }
.status { font-size: 14px; color: var(--ink); min-height: 2.6em; }
.status .dim, .dim { color: var(--ink-dim); }
.small { font-size: 13px; }

.julia-wrap {
  position: relative; width: 100%; aspect-ratio: 1; max-width: 100%;
  border-radius: var(--r-md); overflow: hidden;
  border: 1px solid var(--hairline-strong);
  background: var(--bg);
}
.julia-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.julia-label {
  position: absolute; left: 8px; top: 6px; font-size: 13px; color: var(--ink);
  text-shadow: 0 0 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.6); pointer-events: none;
}
.caption { font-size: 13.5px; color: var(--ink-dim); }

/* landmarks */
.landmarks { display: grid; gap: 4px; }
.lm {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; align-items: baseline;
  width: 100%; text-align: left; padding: 7px 10px; cursor: pointer;
  background: transparent; border: 1px solid transparent; border-radius: var(--r-md);
  transition: background 0.15s ease, border-color 0.15s ease;
}
.lm:hover { background: var(--w05); border-color: var(--hairline); }
.lm.active { background: var(--accent-soft); border-color: var(--accent-line); }
.lm .nm { font-size: 14.5px; color: var(--ink); }
.lm .dp { font-size: 12.5px; color: var(--ink-faint); }
.lm .ds { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-dim); }

/* view & color controls */
.row { display: flex; align-items: center; gap: 10px; }
.row label { flex: 1; color: var(--ink-dim); font-size: 14px; }
.row output { font-size: 14px; min-width: 3.2em; text-align: right; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
.palettes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.pal {
  display: grid; gap: 4px; padding: 5px 5px 4px; cursor: pointer;
  background: var(--field); border: 1px solid var(--hairline); border-radius: var(--r-sm);
  font-size: 12.5px; color: var(--ink-dim); text-align: center;
}
.pal .sw { height: 16px; border-radius: 4px; }
.pal:hover { border-color: var(--hairline-strong); color: var(--ink); }
.pal.active { border-color: var(--accent-line); color: var(--ink); box-shadow: 0 0 12px var(--accent-glow); }
.toggles { display: grid; gap: 6px; }
.tog { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; color: var(--ink); }
.tog input { appearance: none; -webkit-appearance: none; width: 30px; height: 17px; border-radius: 999px; margin: 0;
  background: var(--w12); position: relative; cursor: pointer; transition: background 0.2s ease; flex-shrink: 0; }
.tog input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%;
  background: var(--ink-dim); transition: transform 0.2s var(--ease-out), background 0.2s ease; }
.tog input:checked { background: var(--accent); }
.tog input:checked::after { transform: translateX(13px); background: #fff; }
.tog .dim { font-size: 12.5px; }
.help { font-size: 13.5px; color: var(--ink-dim); display: grid; gap: 6px; }
.help p { margin: 0; }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mode {
  padding: 6px 8px; cursor: pointer; font-size: 13.5px; color: var(--ink-dim);
  background: var(--field); border: 1px solid var(--hairline); border-radius: var(--r-sm);
}
.mode:hover { color: var(--ink); border-color: var(--hairline-strong); }
.mode.active { color: var(--ink); border-color: var(--accent-line); background: var(--accent-soft); }
.poly-row { display: flex; align-items: center; gap: 8px; }
.poly-row .mq-editable-field {
  flex: 1; min-width: 0; padding: 4px 8px; border-radius: var(--r-sm);
  background: var(--field); border: 1px solid var(--hairline-strong); color: var(--ink);
  font-family: KaTeX_Main, "Times New Roman", serif; font-size: 16px;
}
.poly-row .mq-editable-field.mq-focused { border-color: var(--accent-line); box-shadow: 0 0 0 2px var(--accent-glow); }
.poly-row .mq-math-mode var, .poly-row .mq-math-mode i { font-family: KaTeX_Math, "Times New Roman", serif; }
.poly-msg.err { color: #fb7185; }
#message {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 200;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
  background: var(--bg); color: var(--ink); text-align: center; font-size: 16px;
}

@media (max-width: 719px) {
  :root { --panel-w: auto; }
  #control-panel {
    top: auto;
    left: max(var(--gap), env(safe-area-inset-left, 0px));
    right: max(var(--gap), env(safe-area-inset-right, 0px));
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    max-height: 47%;
  }
  #control-panel.collapsed { left: auto; }
  #hud { bottom: auto; top: calc(12px + env(safe-area-inset-top, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  #control-panel, #collapse-btn svg { transition: none; }
}
</style>
</head>
<body>
<div id="stage" aria-label="The Mandelbrot set: drag to pan, scroll to zoom, click to pin a parameter">
  <canvas id="gl"></canvas>
  <canvas id="overlay"></canvas>
</div>
<div id="progress"></div>
<div id="hud"><span id="scale-label"></span><div id="scalebar"></div></div>

<aside id="control-panel" aria-label="Controls">
  <div class="panel-head">
    <div class="panel-name">Mandelbrot Set</div>
    <button id="home-btn" class="icon-btn" aria-label="Show the whole set" title="Show the whole set">
      <svg viewBox="0 0 16 16"><path d="M2.5 7.5 8 3l5.5 4.5M4 6.5V13h3V9.5h2V13h3V6.5"/></svg>
    </button>
    <button id="collapse-btn" class="icon-btn" aria-label="Collapse panel">
      <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>

  <div class="panel-content">
    <section class="sec intro">
      <div class="modes" role="group" aria-label="Picture">
        <button type="button" class="mode active" id="mode-m" data-mix="Parameters $c$ of $z^2 + c$"></button>
        <button type="button" class="mode" id="mode-p" data-mix="Polynomial $f(z)$"></button>
      </div>
      <div id="m-intro" class="intro">
      <div class="def" data-tex="\begin{gathered} \mathcal M = \{\, c \in \mathbb C : f_c^{\circ n}(0) \not\to \infty \,\} \\[2pt] f_c(z) = z^2 + c \end{gathered}"></div>
      <div data-mix="Each pixel is a parameter $c$. It is colored by how fast the orbit $0 \mapsto c \mapsto c^2 + c \mapsto \cdots$ escapes; the black region never escapes."></div>
      </div>
      <div id="p-intro" class="intro" hidden>
        <div class="poly-row"><span data-tex="f(z) ="></span><span id="poly-field"></span></div>
        <div class="small poly-msg" id="poly-msg"></div>
        <div data-mix="Each pixel is a starting point $z$, colored by how fast $z \mapsto f(z) \mapsto f(f(z)) \mapsto \cdots$ escapes; the black region is the filled Julia set $K_f$."></div>
      </div>
    </section>

    <section class="sec" id="point-sec">
      <div class="sec-head"><h3 class="sec-title" id="point-title">Parameter</h3><span id="point-chip" class="chip pinned">Pinned</span></div>
      <div class="kv">
        <span class="k" id="lab-re" data-tex="\operatorname{Re} c"></span><span class="v" id="c-re"></span>
        <span class="k" id="lab-im" data-tex="\operatorname{Im} c"></span><span class="v" id="c-im"></span>
      </div>
      <div class="status" id="status"></div>
      <div class="julia-wrap" id="julia-wrap">
        <canvas id="julia"></canvas>
        <canvas id="julia-orbit"></canvas>
        <span class="julia-label" data-tex="K_c"></span>
      </div>
      <div class="caption" id="julia-caption"></div>
    </section>

    <section class="sec" id="lm-sec">
      <div class="sec-head"><h3 class="sec-title">Landmarks</h3></div>
      <div class="landmarks" id="landmarks"></div>
    </section>

    <section class="sec">
      <div class="sec-head"><h3 class="sec-title">View</h3></div>
      <div class="kv">
        <span class="k">Center</span><span class="v" id="v-re"></span>
        <span class="k"></span><span class="v" id="v-im"></span>
        <span class="k">Width</span><span class="v" id="v-w"></span>
        <span class="k">Iterations</span><span class="v" id="v-n"></span>
      </div>
      <div class="row">
        <label for="iter-mult">Iteration budget</label>
        <output id="iter-mult-out"></output>
      </div>
      <input type="range" id="iter-mult" min="-2" max="4" step="0.5" value="0" aria-label="Iteration budget">
      <div class="small dim" id="v-ref"></div>
    </section>

    <section class="sec">
      <div class="sec-head"><h3 class="sec-title">Color</h3></div>
      <div class="palettes" id="palettes"></div>
      <div class="toggles">
        <label class="tog"><input type="checkbox" id="opt-relief" checked><span>Relief shading</span></label>
        <label class="tog"><input type="checkbox" id="opt-edges" checked><span data-mix="Boundary from the distance estimate"></span></label>
        <label class="tog"><input type="checkbox" id="opt-cycle"><span>Cycle colors</span></label>
      </div>
      <div class="row">
        <label for="opt-cycles">Color bands</label>
        <output id="opt-cycles-out"></output>
      </div>
      <input type="range" id="opt-cycles" min="0.3" max="5" step="0.1" value="1" aria-label="Color bands">
    </section>

    <section class="sec help">
      <div class="sec-head"><h3 class="sec-title">Controls</h3></div>
      <p data-mix="Drag to pan; scroll or pinch to zoom. Double-click zooms in by $4\times$ (Shift: out). Click pins $c$ for the Julia set; arrow keys pan, $+$ and $-$ zoom."></p>
      <p data-mix="Deep views use perturbation: one orbit is computed in exact fixed-point arithmetic, and each pixel follows its offset $\delta_{n+1} = 2Z_n\delta_n + \delta_n^2 + \delta c$ in single precision, rebasing when $|Z_n + \delta_n| < |\delta_n|$. That reaches widths near $10^{-30}$."></p>
    </section>
  </div>
</aside>

<div id="message" hidden></div>

<script>
(function () {
'use strict';

/* ================================================================
   Fixed-point complex coordinates: integers scaled by 2^256
   ================================================================ */
const FB = 256, FBn = 256n, SCALE = 2 ** 256;
const fx = (x) => BigInt(Math.round(x * SCALE));
const fd = (b) => Number(b) / SCALE;
function parseFx(str) {
  let s = String(str).trim(), neg = false;
  if (s[0] === '-') { neg = true; s = s.slice(1); } else if (s[0] === '+') s = s.slice(1);
  const [ip, fp = ''] = s.split('.');
  const v = (BigInt((ip || '0') + fp) << FBn) / 10n ** BigInt(fp.length);
  return neg ? -v : v;
}
function decParts(b, nd) {
  const neg = b < 0n; if (neg) b = -b;
  const p10 = 10n ** BigInt(nd);
  let ip = b >> FBn;
  let f = ((b & ((1n << FBn) - 1n)) * p10 + (1n << (FBn - 1n))) >> FBn;
  if (f >= p10) { f -= p10; ip += 1n; }
  return { neg, ip: ip.toString(), fr: f.toString().padStart(nd, '0') };
}

/* ================================================================
   TeX helpers (all math goes through KaTeX)
   ================================================================ */
const hasKatex = () => typeof window.katex !== 'undefined';
const escapeHtml = (s) => s.replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
function tex(s) { return hasKatex() ? katex.renderToString(s, { throwOnError: false }) : escapeHtml(s); }
function mixTex(s) {
  return s.split(/(\$[^$]+\$)/g).map((p) => (p.length > 2 && p[0] === '$' && p[p.length - 1] === '$') ? tex(p.slice(1, -1)) : escapeHtml(p)).join('');
}
function setTex(el, s) { if (el._t !== s) { el._t = s; el.innerHTML = tex(s); } }
function setMix(el, s) { if (el._t !== s) { el._t = s; el.innerHTML = mixTex(s); } }
function groupDigits(s) {
  const [i, f] = s.split('.');
  const neg = i[0] === '-';
  let d = neg ? i.slice(1) : i;
  if (d.length > 4) d = d.replace(/\B(?=(\d{3})+(?!\d))/g, '\\,');
  return (neg ? '-' : '') + d + (f ? '.' + f : '');
}
function texNum(x, sig = 3) {
  if (!isFinite(x)) return '\\infty';
  if (x === 0) return '0';
  const ax = Math.abs(x);
  if (ax >= 1e-3 && ax < 1e5) return groupDigits(String(Number(x.toPrecision(sig))));
  let e = Math.floor(Math.log10(ax));
  let m = Number((x / 10 ** e).toPrecision(sig));
  if (Math.abs(m) >= 10) { m /= 10; e += 1; }
  const ms = Math.abs(m) === 1 ? (m < 0 ? '-' : '') : m + '\\times';
  return ms + '10^{' + e + '}';
}
const texInt = (n) => groupDigits(String(Math.round(n)));
function texFx(b, nd) {
  const { neg, ip, fr } = decParts(b, nd);
  const zero = ip === '0' && /^0*$/.test(fr);
  return (neg && !zero ? '-' : '\\phantom{-}') + ip + '.' + fr.match(/.{1,5}/g).join('\\,');
}

const $ = (id) => document.getElementById(id);
function fail(msg) { const m = $('message'); m.textContent = msg; m.hidden = false; throw new Error(msg); }

document.querySelectorAll('[data-tex]').forEach((el) => setTex(el, el.dataset.tex));
document.querySelectorAll('[data-mix]').forEach((el) => setMix(el, el.dataset.mix));

/* ================================================================
   Palettes
   ================================================================ */
const PALETTES = [
  { id: 'classic', name: 'Classic', interior: '#000000', edge: '#000000',
    stops: [[0, '#000764'], [0.16, '#206bcb'], [0.42, '#edffff'], [0.6425, '#ffaa00'], [0.8575, '#000200'], [1, '#000764']] },
  { id: 'ember', name: 'Ember', interior: '#0a0306', edge: '#0a0306',
    stops: [[0, '#12040a'], [0.22, '#6b1020'], [0.45, '#e0521c'], [0.62, '#ffc857'], [0.76, '#fff5dc'], [0.9, '#5c1a2e'], [1, '#12040a']] },
  { id: 'lagoon', name: 'Lagoon', interior: '#020a10', edge: '#020a10',
