<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ping-Pong on Sanov's Cones</title>
<style>
  :root { --pz-bg:#F7F3E9; --pz-surface:#E9E6DC; --pz-text:#172C39; --pz-muted:#4E6166; --pz-accent:#12665D; --pz-accent2:#B34530; --pz-font-body: Helvetica, Arial, sans-serif; }
  html, body { height: 100%; }
</style></head><body>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--pz-surface); color: var(--pz-text); font-family: var(--pz-font-body); overflow: hidden; }
  .stage { position: relative; flex: 1; min-width: 0; background: #FCF9F2; cursor: pointer; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .lab { position: absolute; transform: translate(-50%, -50%); padding: 3px 11px; border-radius: 999px; font-weight: 700; font-size: 19px; pointer-events: none; }
  .panel { width: 430px; padding: 28px; display: flex; flex-direction: column; gap: 12px; border-left: 1px solid rgba(23,44,57,.14); }
  .k { font-size: 15px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--pz-accent); margin-top: 6px; }
  .word { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; }
  .chip { display: inline-flex; align-items: center; justify-content: center; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 21px; transition: transform .2s, opacity .2s; }
  .todo { opacity: .32; }
  .now { transform: translateY(-3px) scale(1.08); outline: 3px solid var(--pz-text); }
  .miss { outline: 3px dashed #f08a65; opacity: .65; }
  .status { font-size: 22px; min-height: 36px; }
  input[type=range] { width: 100%; accent-color: var(--pz-accent); }
  button { font: 600 19px var(--pz-font-body); padding: 11px 16px; border-radius: 12px; border: 1px solid var(--pz-accent); background: rgba(18,102,93,.10); color: var(--pz-text); cursor: pointer; }
  .note { font-size: 18px; color: var(--pz-muted); line-height: 1.38; margin-top: auto; }
  .warn { color: #B34530; font-weight: 600; }
  math { font-family: math, 'STIX Two Math', 'Latin Modern Math', serif; font-size: 1.12em; }
  .chip math, .lab math { font-weight: 700; }
</style>
<div class="stage" id="stage"><canvas id="c"></canvas></div>
<aside class="panel">
  <div class="k">Reduced Word (applied right-to-left)</div>
  <div class="word" id="word"></div>
  <div class="k">Where the Ball Landed</div>
  <div class="status" id="status"></div>
  <div class="k">Shear Strength <span data-m="t"></span> = <span id="tv">2.00</span></div>
  <input id="tslider" type="range" min="1" max="3" step="0.05" value="2">
  <div id="tnote" style="font-size:18px;color:var(--pz-accent);"></div>
  <button id="newbtn">Deal a New Random Word</button>
  <div class="note">Click the wheel or drag <b>t</b> below 2 (try t = 1!) to watch the ping-pong cones break down.</div>
</aside>
<script>
const COLOR = { a: '#E8794F', A: '#E3A92F', b: '#2FAE9B', B: '#9275E0' };
const INK = { a: '#0d1f22', A: '#0d1f22', b: '#0d1f22', B: '#0d1f22' };
// labels typeset from LaTeX (KaTeX → MathML)
const MM = {A: '<math><mrow><mi>A</mi></mrow></math>', Ai: '<math><mrow><msup><mi>A</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow></math>', B: '<math><mrow><mi>B</mi></mrow></math>', Bi: '<math><mrow><msup><mi>B</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow></math>', DA: '<math><mrow><mi>D</mi><mo>(</mo><mi>A</mi><mo>)</mo></mrow></math>', DAi: '<math><mrow><mi>D</mi><mo>(</mo><msup><mi>A</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo>)</mo></mrow></math>', DB: '<math><mrow><mi>D</mi><mo>(</mo><mi>B</mi><mo>)</mo></mrow></math>', DBi: '<math><mrow><mi>D</mi><mo>(</mo><msup><mi>B</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo>)</mo></mrow></math>', t: '<math><mrow><mi>t</mi></mrow></math>', two: '<math><mrow><mn>2</mn></mrow></math>', t1: '<math><mrow><mi>t</mi><mo>=</mo><mn>1</mn></mrow></math>', tge: '<math><mrow><mi>t</mi><mo>≥</mo><mn>2</mn></mrow></math>', tlt: '<math><mrow><mi>t</mi><mo>&lt;</mo><mn>2</mn></mrow></math>', rel: '<math><mrow><mo>(</mo><mi>A</mi><msup><mi>B</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mi>A</mi><msup><mo>)</mo><mn>4</mn></msup><mo>=</mo><mi>I</mi></mrow></math>', neq: '<math><mrow><mo>≠</mo></mrow></math>'};
const NAME = { a: MM.A, A: MM.Ai, b: MM.B, B: MM.Bi };
const SETLABEL = { a: MM.DA, A: MM.DAi, b: MM.DB, B: MM.DBi };
document.querySelectorAll('[data-m]').forEach(el => el.innerHTML = MM[el.dataset.m]);
document.querySelector('.note').innerHTML = 'Click the wheel or drag ' + MM.t + ' below ' + MM.two + ' (try ' + MM.t1 + '!) to watch the ping-pong cones break down.';
const INV = { a: 'A', A: 'a', b: 'B', B: 'b' };
const MIDS = { a: [22.5, 202.5], b: [67.5, 247.5], B: [112.5, 292.5], A: [157.5, 337.5] };
const stage = document.getElementById('stage'), c = document.getElementById('c'), g = c.getContext('2d');
const tslider = document.getElementById('tslider');
const DUST = [];   // colored dust: points of the plane outside the disk, colored by the cone they sit in; each letter shears them while the disk stays put
for (let i = 0; i < 16000; i++) {
  const th = Math.random() * 2 * Math.PI, r = i % 2 ? Math.exp(Math.log(0.4) + Math.random() * Math.log(3.2 / 0.4)) : 2.3 * Math.sqrt(Math.random());
  DUST.push({ x: r * Math.cos(th), y: r * Math.sin(th), s: 'abBA'[Math.floor(th / (Math.PI / 4)) % 4] });
}
const DUSTKEYS = ['a', 'A', 'b', 'B'];
let prev = null;   // the letter just applied (its sheared dust fades out before the next one starts)
let shearT = 2, speed = 1.05, word = [], k = -1, u = 0, hold = 0, v = [1,0], start0 = 'a', landed = [], path = [];

tslider.oninput = () => { shearT = +tslider.value; syncT(); };
function syncT() {
  document.getElementById('tv').textContent = shearT.toFixed(2);
  const n = document.getElementById('tnote');
  n.innerHTML = shearT >= 2 ? MM.tge + ': every letter lands cleanly inside its own cone!' : MM.tlt + ': cones leak! At ' + MM.t1 + ', ' + MM.rel + '.';
  n.title = shearT >= 2 ? 'every letter lands cleanly inside its own cone' : 't < 2: cones leak! At t = 1, (AB⁻¹A)⁴ = I.';
  n.className = shearT >= 2 ? '' : 'warn';
}

const chip = (txt, s, cls='') => '<span class="chip '+cls+'" style="background:'+COLOR[s]+';color:'+INK[s]+'">'+txt+'</span>';
function inSet(p, s) {
  const [x, y] = p, flat = Math.abs(x) > Math.abs(y), steep = Math.abs(y) > Math.abs(x);
  if (s === 'a') return flat && x*y > 0;
  if (s === 'A') return flat && x*y < 0;
  if (s === 'b') return steep && x*y > 0;
  return steep && x*y < 0;
}
function shear(s, p, amt) {
  const [x, y] = p, sgn = (s === 'a' || s === 'b') ? 1 : -1;
  return (s === 'a' || s === 'A') ? [x + sgn*amt*y, y] : [x, y + sgn*amt*x];
}
const unit = p => { const r = Math.hypot(p[0], p[1]); return [p[0]/r, p[1]/r]; };

function start() {
  word = [];
  while (word.length < 6) {
    const ok = ['a','A','b','B'].filter(s => !word.length || s !== INV[word[word.length-1]]);
    word.push(ok[Math.floor(Math.random()*ok.length)]);
  }
  const ok0 = ['a','A','b','B'].filter(s => s !== word[0] && s !== INV[word[word.length-1]]);
  start0 = ok0[Math.floor(Math.random()*ok0.length)];
  const deg = MIDS[start0][Math.random()<.5?0:1] + (Math.random()-.5)*26;
  v = [Math.cos(deg*Math.PI/180), Math.sin(deg*Math.PI/180)];
  k = word.length - 1; u = 0; hold = .55; landed = []; path = []; prev = null;
  renderHUD();
}
function renderHUD() {
  document.getElementById('word').innerHTML = word.map((s, i) => {
    const st = i > k ? (landed[word.length-1-i].hit ? '' : 'miss') : (i === k ? 'now' : 'todo');
    return chip(NAME[s], s, st);
  }).join('');
  const last = landed[landed.length-1];
  document.getElementById('status').innerHTML = !last
    ? 'Starts in ' + chip(SETLABEL[start0], start0)
    : (!last.hit ? 'Missed ' + chip(SETLABEL[last.s], last.s) + '!'
      : (k < 0 && landed.every(p => p.hit) ? 'Ended in ' + chip(SETLABEL[last.s], last.s) + ' ' + MM.neq + ' ' + chip(SETLABEL[start0], start0)
        : 'Landed in ' + chip(SETLABEL[last.s], last.s)));
}

const labels = [];
for (const [s, mids] of Object.entries(MIDS)) for (const m of mids) {
  const el = document.createElement('div');
  el.className = 'lab'; el.style.background = COLOR[s]; el.style.color = INK[s];
  el.innerHTML = SETLABEL[s]; stage.append(el); labels.push({ el, m });
}
function placeLabels() {
  const w = stage.clientWidth, h = stage.clientHeight, R = Math.min(w, h)/2 - 64;
  for (const { el, m } of labels) {
    const a = m*Math.PI/180;
    el.style.left = (w/2 + (R+38)*Math.cos(a)) + 'px';
    el.style.top = (h/2 - (R+38)*Math.sin(a)) + 'px';
  }
}
const radOf = j => .24 + .70 * j / word.length;
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - lastT)/1000); lastT = now;
  if (hold > 0) { hold -= dt; if (hold <= 0 && k < 0) start(); }
  else if (k >= 0) {
    u += dt * speed * 0.88;
    if (u >= 1) {
      const s = word[k]; v = unit(shear(s, v, shearT));
      landed.push({ v, s, hit: inSet(v, s) }); prev = { s };
      k--; u = 0; hold = k < 0 ? 2.4 : 0.32; renderHUD();
    }
  }
  const dpr = devicePixelRatio || 1, w = stage.clientWidth, h = stage.clientHeight;
  if (c.width !== Math.round(w*dpr) || c.height !== Math.round(h*dpr)) { c.width = Math.round(w*dpr); c.height = Math.round(h*dpr); placeLabels(); }
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const cx = w/2, cy = h/2, R = Math.min(w, h)/2 - 64;
  const P = (p, r, sgn=1) => [cx + sgn*p[0]*r*R, cy - sgn*p[1]*r*R];
  for (const [s, mids] of Object.entries(MIDS)) for (const m of mids) {
    g.beginPath(); g.moveTo(cx, cy);
    g.arc(cx, cy, R, -(m-22.5)*Math.PI/180, -(m+22.5)*Math.PI/180, true);
    g.closePath(); g.fillStyle = COLOR[s]; g.globalAlpha = .30; g.fill();
  }
  g.globalAlpha = .5; g.strokeStyle = '#7d9694'; g.lineWidth = 1.4; g.setLineDash([6,6]);
  for (let i = 0; i < 4; i++) { const a = i*Math.PI/4; g.beginPath(); g.moveTo(cx-R*Math.cos(a), cy+R*Math.sin(a)); g.lineTo(cx+R*Math.cos(a), cy-R*Math.sin(a)); g.stroke(); }
  g.setLineDash([]); g.beginPath(); g.arc(cx, cy, R, 0, Math.PI*2); g.stroke(); g.globalAlpha = 1;

  // dust: the plane outside the fixed disk, sheared by the current letter (cones keep their colors, so you see who lands where)
  let dS = null, dAmt = 0, dA = 1;
  if (k >= 0 && hold <= 0) { dS = word[k]; dAmt = shearT * (u < .5 ? 2*u*u : 1 - 2*(1-u)*(1-u)); dA = Math.min(1, u * 6); }
  else if (prev) { dS = prev.s; dAmt = shearT; dA = Math.min(1, hold / .35); }
  else dA = Math.min(1, (.55 - hold) * 4);
  g.globalAlpha = .85 * Math.max(0, dA);
  for (const sk of DUSTKEYS) {
    g.fillStyle = COLOR[sk]; g.beginPath();
    for (const d of DUST) {
      if (d.s !== sk) continue;
      let x = d.x, y = d.y;
      if (dS) { const m = shear(dS, [x, y], dAmt); x = m[0]; y = m[1]; }
      if (x*x + y*y < 1) continue;
      const px = cx + x*R, py = cy - y*R;
      if (px < -4 || py < -4 || px > w + 4 || py > h + 4) continue;
      g.rect(px - 1.3, py - 1.3, 2.6, 2.6);
    }
    g.fill();
  }
  g.globalAlpha = 1;

  const j = word.length - 1 - k;
  const ease = u < .5 ? 2*u*u : 1 - 2*(1-u)*(1-u);
  const cur = (k < 0 || hold > 0)
    ? { d: v, r: radOf(Math.min(j, word.length)), s: landed.length ? landed[landed.length-1].s : start0 }
    : { d: unit(shear(word[k], v, shearT*ease)), r: radOf(j) + (radOf(j+1)-radOf(j))*ease, s: word[k] };
  if (k >= 0 && hold <= 0) path.push(cur);

  g.lineWidth = 3;
  for (const sgn of [1, -1]) for (let i = 1; i < path.length; i++) {
    const a = P(path[i-1].d, path[i-1].r, sgn), b = P(path[i].d, path[i].r, sgn);
    g.strokeStyle = COLOR[path[i].s]; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
  }
  for (const sgn of [1, -1]) {
    const q = P(cur.d, cur.r, sgn);
    g.beginPath(); g.arc(q[0], q[1], 12, 0, Math.PI*2);
    g.fillStyle = COLOR[cur.s]; g.fill(); g.lineWidth = 3; g.strokeStyle = '#172C39'; g.stroke();
  }
  requestAnimationFrame(frame);
}
stage.onclick = start; document.getElementById('newbtn').onclick = start;
new ResizeObserver(placeLabels).observe(stage);
syncT(); start(); requestAnimationFrame(frame);
</script>
</body></html>
