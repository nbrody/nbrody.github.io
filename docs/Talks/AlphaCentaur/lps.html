<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LPS square complex</title>
<style>
  html, body, #complex { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0c111c; }
  #complex canvas { display: block; width: 100%; height: 100%; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="complex" role="img" aria-label="Interactive LPS square complex; drag to rotate, scroll to zoom"></div>
<script type="module">
import { buildVHComplex } from '../../GeometryofLinearGroups/Geometric/Tools/padicGroups/quaternionCalculator/quaternionPackage/vhComplex.js';
import { FoldedComplexView } from '../../GeometryofLinearGroups/Geometric/Tools/padicGroups/quaternionCalculator/vis/vis_folded.js';

const container = document.getElementById('complex');
const view = new FoldedComplexView(container);
view.params.fold = 0;
view.setComplex(buildVHComplex(5, 13));

window.addEventListener('resize', () => view.resize());
if (window.ResizeObserver) new ResizeObserver(() => view.resize()).observe(container);

window.addEventListener('message', (event) => {
  if (event.source !== window.parent || event.origin !== location.origin) return;
  if (event.data?.type === 'pz-button' && event.data.name === 'toggle-fold') {
    view.animateFold(view.params.fold > 0.5 ? 0 : 1);
  }
});
</script>
</body>
</html>
