<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentation Calculator view</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1218; overflow: hidden; }
  iframe { border: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<!-- One card of the Presentation Calculator, for a slide of the AlphaCentaur talk.
       pcalc.html?card=places&zoom=0.9#s=…     (the #s=… is the calculator's own permalink)
     card: top | verdict | zariski | congruence | places | view (the live poincare
           or trees view of a discrete place) | sarith (default top).
     calc: where the calculator is, relative to this page (default: this site's copy).
     The calculator computes when it opens; this page keeps the card in view while
     the cards above it fill in, until you scroll it yourself. -->
<iframe id="calc" title="Presentation Calculator"></iframe>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var calc = q.get('calc') || '../../GeometryofLinearGroups/PresentationCalc/';
  if (!/^(?:\.\.?\/)+[\w./-]*$/.test(calc)) calc = '../../GeometryofLinearGroups/PresentationCalc/';
  var card = q.get('card') || 'top', zoom = Math.min(1.5, Math.max(0.4, Number(q.get('zoom')) || 1));
  var target = { top: null, verdict: '#verdict', zariski: '#card-zariski', congruence: '#cong-h', places: '#card-places', view: '#card-places iframe', sarith: '#card-sarith' }[card];
  var frame = document.getElementById('calc');
  // Scale the whole frame with a transform, not CSS zoom: zoom doesn't carry into the calculator's
  // own poincare and trees frames the same way in every browser (white bands around their canvases).
  if (zoom !== 1) {
    frame.style.width = (100 / zoom) + '%'; frame.style.height = (100 / zoom) + '%';
    frame.style.transformOrigin = '0 0'; frame.style.transform = 'scale(' + zoom + ')';
  }
  frame.src = calc + location.hash;

  var userScrolled = false, timer = null;
  frame.addEventListener('load', function () {
    var w = frame.contentWindow, d = frame.contentDocument;
    if (!d) return;                                   // another origin: show the page as it is
    if (!target) return;
    ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function (t) {
      w.addEventListener(t, function () { userScrolled = true; }, { passive: true, capture: true });
    });
    var tries = 0;
    timer = setInterval(function () {
      tries++;
      var el = d.querySelector(target);
      if (el && !el.hidden && !el.closest('[hidden]') && !userScrolled) {
        var box = target === '#card-places iframe' ? (el.parentElement || el) : el;
        var top = box.getBoundingClientRect().top + w.scrollY - 12;
        if (Math.abs(w.scrollY - top) > 4) w.scrollTo(0, top);
      }
      if (userScrolled || tries > 240) clearInterval(timer);   // two minutes at most
    }, 500);
  });
})();
</script>
</body>
</html>
