<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One slide of another talk</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0d16; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }
  iframe { flex: 1; min-height: 0; border: 0; display: block; width: 100%; background: #0a0d16; }
  #bar { flex: none; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 8px 12px; background: #151a23; border-top: 1px solid #2a3140; color: #c9d2e3; font-size: 17px; }
  #bar[hidden] { display: none; }
  #bar button { appearance: none; border: 0; cursor: pointer; font: inherit; color: #f2d493; background: transparent; border-radius: 10px; padding: 4px 18px; font-size: 26px; line-height: 1; }
  #bar button:hover:not(:disabled) { background: #222a38; }
  #bar button:disabled { opacity: .3; cursor: default; }
  #count { min-width: 5em; text-align: center; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<!-- One slide of a reveal.js talk, held to that slide, for a slide of the AlphaCentaur talk.
       slidestep.html?src=<path to the talk's page>#/<slide id>
     The talk opens on that slide with its own arrows, progress bar and keys switched off. The arrows
     under it (or the buttons the phone remote can send: pz-button "prev-step" / "next-step", or the
     arrow keys) step through the slide's own fragments, one click of the talk each, and never leave
     the slide. The talk's own pointer handling (drag, zoom) is untouched. -->
<div id="app">
  <iframe id="talk" title="Slide"></iframe>
  <div id="bar" hidden>
    <button id="prev" title="Previous step" aria-label="Previous step">‹</button>
    <span id="count"></span>
    <button id="next" title="Next step" aria-label="Next step">›</button>
  </div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search), src = q.get('src') || '';
  if (!/^(?:\.\.?\/)+[\w./-]*\.html$/.test(src)) { document.body.textContent = 'slidestep.html needs ?src=<relative path to a reveal.js talk>#/<slide id>'; return; }
  var frame = document.getElementById('talk'), bar = document.getElementById('bar'), count = document.getElementById('count');
  var prev = document.getElementById('prev'), next = document.getElementById('next');
  frame.src = src + location.hash;

  var R = null, total = 1;
  // Steps = groups of fragments shown so far (the slide's data-fragment-index values).
  function groups(slide, onlyVisible) {
    var seen = {};
    Array.prototype.forEach.call(slide.querySelectorAll('.fragment' + (onlyVisible ? '.visible' : '')), function (f) { seen[f.getAttribute('data-fragment-index') || f.className] = 1; });
    return Object.keys(seen).length;
  }
  function paint() {
    if (!R) return;
    var slide = R.getCurrentSlide(), step = slide ? groups(slide, true) : 0;
    total = (slide ? groups(slide, false) : 0) + 1;
    count.textContent = (step + 1) + ' / ' + total;
    prev.disabled = step === 0; next.disabled = step >= total - 1;
  }
  function step(dir) { if (!R) return; if (dir > 0) R.nextFragment(); else R.prevFragment(); paint(); }
  next.onclick = function () { step(1); }; prev.onclick = function () { step(-1); };
  addEventListener('message', function (e) {
    var m = e.data || {};
    if (m.type === 'pz-button' && m.name === 'next-step') step(1);
    if (m.type === 'pz-button' && m.name === 'prev-step') step(-1);
  });
  var NEXT = { ArrowRight: 1, ArrowDown: 1, PageDown: 1, ' ': 1 }, PREV = { ArrowLeft: 1, ArrowUp: 1, PageUp: 1 };
  function keys(w) {
    w.addEventListener('keydown', function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '')) return;
      if (NEXT[e.key]) { e.preventDefault(); step(1); } else if (PREV[e.key]) { e.preventDefault(); step(-1); }
    }, true);
  }
  keys(window);

  frame.addEventListener('load', function () {
    var tries = 0, t = setInterval(function () {
      tries++;
      var w = frame.contentWindow;
      try {
        if (w.Reveal && w.Reveal.isReady && w.Reveal.isReady()) {
          clearInterval(t);
          R = w.Reveal;
          R.configure({ controls: false, progress: false, keyboard: false, touch: false, mouseWheel: false, overview: false, help: false, slideNumber: false });
          // The talk's own "next" (it calls Reveal.next() when an arrow key is pressed inside an app) stays on the slide.
          R.next = function () { step(1); }; R.prev = function () { step(-1); };
          keys(w);
          var st = w.document.createElement('style'); st.textContent = '.reveal .controls, .reveal .progress { display: none !important; }'; w.document.head.appendChild(st);
          R.on('fragmentshown', paint); R.on('fragmenthidden', paint); R.on('slidechanged', paint);
          bar.hidden = false; paint();
        }
      } catch (e) { /* another origin: leave the talk as it is */ clearInterval(t); }
      if (tries > 120) clearInterval(t);
    }, 500);
  });
})();
</script>
</body>
</html>
