<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating the Grid</title>
    <meta name="description" content="Which rotations send the square grid ℤ² to itself — or at least a fraction of it? SO₃(ℚ) talk, part 1.">
    <link rel="stylesheet" href="../common/viz.css">
    <link rel="stylesheet" href="grid.css">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
            startup: { typeset: false },
            options: { enableMenu: false }
        };
    </script>
    <script defer src="../../vendor/mathjax/tex-mml-chtml.js"></script>
</head>

<body data-viz="grid">
    <div id="stage"></div>

    <div id="readout" class="card ro"></div>

    <div id="spectrum" class="card">
        <div class="sp-head">
            <span class="sp-title">Fraction of the grid that lands on the grid</span>
            <span class="sp-hint">drag here, or turn the grid</span>
        </div>
        <div class="sp-plot"></div>
    </div>

    <div id="captions"></div>
    <div id="nav" class="card">
        <button class="nav-prev" aria-label="Previous step">&lsaquo;</button>
        <span class="nav-count"></span>
        <button class="nav-next" aria-label="Next step">&rsaquo;</button>
    </div>

    <script src="../common/gauss.js"></script>
    <script src="../common/viz.js"></script>
    <script src="grid.js"></script>
</body>

</html>
