<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axes and Partitions</title>
    <meta name="description" content="Rational rotations about one axis move a point through the rational points of a circle; and why O₂(ℝ) is a maximal subgroup of SO₃(ℝ), with the rational version of the argument. SO₃(ℚ) talk, part 3.">
    <link rel="stylesheet" href="../common/viz.css">
    <style>
        #readout {
            position: fixed;
            left: 22px;
            top: 20px;
            z-index: 11;
            padding: 12px 16px 13px;
            min-width: 230px;
            max-width: 380px;
            font-size: 0.9rem;
            line-height: 1.5;
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        #readout.on { opacity: 1; transform: none; }
        #readout .r-title { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 6px; }
        #readout .r-big { font-family: 'Times New Roman', Times, serif; font-size: 1.15rem; color: #fff; }
        #readout .r-big i { font-style: italic; }
        #readout .r-dim { color: var(--ink-dim); font-size: 0.82rem; }
        #readout table { border-collapse: collapse; margin-top: 2px; }
        #readout td { padding: 1px 10px 1px 0; font-size: 0.84rem; color: var(--ink-dim); white-space: nowrap; }
        #readout td.f { font-family: 'Times New Roman', Times, serif; font-size: 0.98rem; color: var(--ink); }
        #readout .sw { display: inline-block; width: 16px; height: 4px; border-radius: 2px; vertical-align: middle; }
    </style>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
            startup: { typeset: false },
            options: { enableMenu: false }
        };
    </script>
    <script defer src="../../vendor/mathjax/tex-mml-chtml.js"></script>
</head>

<body data-viz="sphere">
    <div id="stage"></div>
    <div id="readout" class="card"></div>
    <div id="captions"></div>
    <div id="nav" class="card">
        <button class="nav-prev" aria-label="Previous step">&lsaquo;</button>
        <span class="nav-count"></span>
        <button class="nav-next" aria-label="Next step">&rsaquo;</button>
    </div>

    <script src="../common/quat.js"></script>
    <script src="../common/viz.js"></script>
    <script src="../common/view3d.js"></script>
    <script src="sphere.js"></script>
</body>

</html>
