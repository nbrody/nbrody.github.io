<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="robots" content="noindex">
<title>Remote</title>
<style>html,body{margin:0;height:100%;background:#0b1020}#app{min-height:100%;display:flex;flex-direction:column}#app>.pzr{flex:1}</style>
</head>
<body>
<!-- Phone remote for presentations made with alphaPresent, alphaCentaur's slide editor.
     The presenting deck shows a QR code (press R) that opens this page with its session. -->
<div id="app"></div>
<script>
/* Phone remote — the link between a presenting deck and phones.
 *
 * A session is a small tree at <root>/<session> in the Firebase Realtime
 * Database (root is the config's `root`, default pz-remote):
 *   deck            what the phone renders (titles, notes, controls, theme)
 *   state           { index, count, step, steps, startedAt }
 *   cmd/<push id>   { k: next|prev|goto|button, … } queued by phones
 *   params/<name>   { v, t }      sliders and switches (latest wins)
 *   joy/<name>      { x, y, t }   joysticks (latest wins)
 *   phones/<id>     connected phones
 *
 * The same API also runs over a BroadcastChannel ("local"), for trying a
 * remote in another window on the same computer without Firebase.
 * Plain script (no modules): it is inlined into exported decks and into the
 * phone page. Sets self.PZRemoteLink. */
(function (root) {
  'use strict';
  var SDK = 'https://www.gstatic.com/firebasejs/9.22.1/';
  var sdk = null;
  function script(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = res; s.onerror = function () { rej(new Error('Could not load Firebase (offline?)')); };
      document.head.appendChild(s);
    });
  }
  function loadFirebase() {
    if (root.firebase && root.firebase.database) return Promise.resolve(root.firebase);
    if (!sdk) sdk = script(SDK + 'firebase-app-compat.js').then(function () { return script(SDK + 'firebase-database-compat.js'); }).then(function () { return root.firebase; });
    return sdk;
  }

  // Session names: 12 characters, no look-alikes (the rules require ≥ 12).
  function newSession() {
    var a = 'abcdefghjkmnpqrstuvwxyz23456789', b = new Uint8Array(12), s = '';
    crypto.getRandomValues(b);
    for (var i = 0; i < b.length; i++) s += a[b[i] % a.length];
    return s;
  }
  var validSession = function (s) { return /^[a-z0-9]{12,40}$/.test(s || ''); };

  function firebaseLink(cfg, session) {
    return loadFirebase().then(function (fb) {
      var name = 'pz-' + cfg.projectId;
      var inst = fb.apps.filter(function (a) { return a.name === name; })[0] ||
        fb.initializeApp({ apiKey: cfg.apiKey, databaseURL: cfg.databaseURL, projectId: cfg.projectId }, name);
      var dir = (cfg.root || 'pz-remote') + '/';
      var db = inst.database(), base = db.ref(dir + session), info = db.ref('.info/connected');
      var at = function (p) { return p ? base.child(p) : base; };
      return {
        kind: 'firebase', session: session,
        set: function (p, v) { return at(p).set(v); },
        push: function (p, v) { return at(p).push(v); },
        remove: function (p) { return at(p).remove(); },
        removeOnDisconnect: function (p) { return at(p).onDisconnect().remove(); },
        onValue: function (p, cb, fail) {
          var r = at(p), f = function (s) { cb(s.val()); };
          r.on('value', f, fail);
          return function () { r.off('value', f); };
        },
        onChild: function (p, cb) {
          var r = at(p), f = function (s) { cb(s.val(), function () { return s.ref.remove(); }); };
          r.on('child_added', f);
          return function () { r.off('child_added', f); };
        },
        onConnected: function (cb) {
          var f = function (s) { cb(!!s.val()); };
          info.on('value', f);
          return function () { info.off('value', f); };
        },
        // A round trip through the database: write, read back, delete.
        ping: function () {
          var r = db.ref(dir + newSession() + '/ping'), v = Date.now();
          return r.set(v).then(function () { return r.once('value'); }).then(function (s) {
            if (s.val() !== v) throw new Error('The database returned something else.');
            return r.parent.remove();
          });
        },
        close: function () { base.off(); info.off(); },
      };
    });
  }

  // The same calls over a BroadcastChannel: each window keeps a copy of the
  // tree; the presenter answers a newcomer's "hello" with the whole tree.
  function localLink(session, role) {
    var ch = new BroadcastChannel('pz-remote/' + session), tree = {}, subs = [], disc = [];
    var parts = function (p) { return p ? String(p).split('/').filter(Boolean) : []; };
    var get = function (p) { var n = tree; for (var k of parts(p)) { if (!n || typeof n !== 'object') return null; n = n[k]; } return n === undefined ? null : n; };
    var put = function (p, v) {
      var ks = parts(p);
      if (!ks.length) { tree = v && typeof v === 'object' ? JSON.parse(JSON.stringify(v)) : {}; return; }
      var n = tree;
      for (var i = 0; i < ks.length - 1; i++) { if (!n[ks[i]] || typeof n[ks[i]] !== 'object') n[ks[i]] = {}; n = n[ks[i]]; }
      if (v === null || v === undefined) delete n[ks[ks.length - 1]]; else n[ks[ks.length - 1]] = JSON.parse(JSON.stringify(v));
    };
    var related = function (a, b) { var x = parts(a).join('/'), y = parts(b).join('/'); return !x || !y || x === y || x.indexOf(y + '/') === 0 || y.indexOf(x + '/') === 0; };
    function apply(m) {
      if (m.op === 'set') put(m.path, m.value);
      else if (m.op === 'sync') tree = m.tree || {};
      else if (m.op === 'push') put(m.path + '/' + m.key, m.value);
      else if (m.op === 'hello') { if (role === 'presenter') ch.postMessage({ op: 'sync', tree: tree }); return; }
      for (var s of subs.slice()) {
        if (s.kind === 'value' && (m.op === 'sync' || related(s.path, m.path))) s.cb(get(s.path));
        if (s.kind === 'child' && m.op === 'push' && parts(s.path).join('/') === parts(m.path).join('/')) s.cb(m.value, function () { put(m.path + '/' + m.key, null); });
      }
    }
    ch.onmessage = function (e) { if (e.data && e.data.op) apply(e.data); };
    var send = function (m) { apply(m); ch.postMessage(m); return Promise.resolve(); };
    addEventListener('pagehide', function () { for (var p of disc) ch.postMessage({ op: 'set', path: p, value: null }); });
    ch.postMessage({ op: 'hello' });
    return Promise.resolve({
      kind: 'local', session: session,
      set: function (p, v) { return send({ op: 'set', path: p, value: v }); },
      push: function (p, v) { return send({ op: 'push', path: p, key: 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), value: v }); },
      remove: function (p) { return send({ op: 'set', path: p || '', value: null }); },
      removeOnDisconnect: function (p) { disc.push(p || ''); return Promise.resolve(); },
      onValue: function (p, cb) { var s = { kind: 'value', path: p, cb: cb }; subs.push(s); cb(get(p)); return function () { subs.splice(subs.indexOf(s), 1); }; },
      onChild: function (p, cb) { var s = { kind: 'child', path: p, cb: cb }; subs.push(s); return function () { subs.splice(subs.indexOf(s), 1); }; },
      onConnected: function (cb) { cb(true); return function () {}; },
      ping: function () { return Promise.resolve(); },
      close: function () { ch.close(); },
    });
  }

  // Several links as one (the presenter talks to Firebase and to this computer).
  function both(links) {
    var all = function (f) { return Promise.all(links.map(f)); };
    var join = function (offs) { return function () { offs.forEach(function (o) { o(); }); }; };
    return {
      kind: links.map(function (l) { return l.kind; }).join('+'), session: links[0].session, links: links,
      set: function (p, v) { return all(function (l) { return l.set(p, v); }); },
      push: function (p, v) { return all(function (l) { return l.push(p, v); }); },
      remove: function (p) { return all(function (l) { return l.remove(p); }); },
      removeOnDisconnect: function (p) { return all(function (l) { return l.removeOnDisconnect(p); }); },
      onValue: function (p, cb) { return join(links.map(function (l) { return l.onValue(p, cb); })); },
      onChild: function (p, cb) { return join(links.map(function (l) { return l.onChild(p, cb); })); },
      onConnected: function (cb) { return links[0].onConnected(cb); },
      close: function () { links.forEach(function (l) { l.close(); }); },
    };
  }

  root.PZRemoteLink = {
    newSession: newSession,
    validSession: validSession,
    loadFirebase: loadFirebase,
    // { firebase?: config, session, local?: bool, role: 'presenter' | 'phone' }
    connect: function (o) {
      if (!validSession(o.session)) return Promise.reject(new Error('This remote link is incomplete.'));
      if (o.local || !o.firebase) return localLink(o.session, o.role);
      return firebaseLink(o.firebase, o.session);
    },
    connectPresenter: function (firebase, session) {
      var local = localLink(session, 'presenter');
      if (!firebase) return local;
      return Promise.all([local, firebaseLink(firebase, session).catch(function (e) { console.warn('Phone remote:', e.message); return null; })])
        .then(function (ls) { return ls[1] ? both([ls[1], ls[0]]) : ls[0]; });
    },
    test: function (firebase) { return firebaseLink(firebase, newSession()).then(function (l) { return l.ping().then(function () { l.close(); }); }); },
  };
})(self);

</script>
<script>
/* Phone remote — the interface. Used by the phone page and by the editor's
 * preview, so what you design is what the phone shows. Plain script; sets
 * self.PZRemoteUI = { mount(root, { onEvent, preview }) → { update(model) } }.
 *
 * model = { title, theme: { colors, fonts, fontURLs }, controls: [...],
 *           state: { index, count, step, steps, startedAt },
 *           slides: [{ t: title, n: notes }], params: { name: value },
 *           status: { text, ok } }
 * events: { k: 'next' | 'prev' | 'goto' (i) | 'button' (name)
 *              | 'param' (name, value) | 'joy' (name, x, y) }   x, y ∈ [−1, 1], y up */
(function (root) {
  'use strict';
  var CSS = [
    '.pzr{--bg:#0b1020;--surface:#18203a;--text:#e9edf8;--muted:#97a3c4;--accent:#7c9cff;--accent2:#f6a85b;--fh:system-ui,sans-serif;--fb:system-ui,sans-serif;',
    'min-height:100%;box-sizing:border-box;background:var(--bg);color:var(--text);font-family:var(--fb);display:flex;flex-direction:column;gap:12px;',
    'padding:max(14px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow-x:hidden}',
    '.pzr *{box-sizing:border-box;margin:0}',
    '.pzr-head{display:flex;align-items:center;gap:10px;min-height:22px}',
    '.pzr-title{flex:1;font:700 16px/1.2 var(--fh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
    '.pzr-dot{width:9px;height:9px;border-radius:50%;background:#e5534b;flex:none}.pzr-dot.ok{background:#3fb950}',
    '.pzr-status{font-size:12px;color:var(--muted)}',
    '.pzr-card{background:var(--surface);border-radius:18px;padding:14px 16px}',
    '.pzr-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}',
    '.pzr-btn{appearance:none;border:0;border-radius:16px;background:var(--surface);color:var(--text);font:600 18px/1.1 var(--fb);padding:14px;min-height:58px;touch-action:manipulation;cursor:pointer;width:100%}',
    '.pzr-btn.accent{background:var(--accent);color:var(--bg)}',
    '.pzr-btn:active{transform:scale(.97);filter:brightness(1.12)}',
    '.pzr-nav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}.pzr-nav .pzr-btn{min-height:76px;font-size:21px}',
    '.pzr>.pzr-nav:last-child,.pzr>.pzr-btn:last-child{margin-top:auto}',
    '.pzr-next{min-height:36vh;flex:1 1 auto;font-size:30px;border-radius:24px}',
    '.pzr-progress{display:flex;align-items:baseline;gap:6px;font-family:var(--fh)}.pzr-progress b{font-size:30px;line-height:1}.pzr-progress span{color:var(--muted);font-size:15px}',
    '.pzr-progress em{margin-left:auto;font-style:normal;color:var(--muted);font-size:13px}',
    '.pzr-bar{height:5px;border-radius:3px;background:color-mix(in srgb,var(--text) 14%,transparent);overflow:hidden;margin-top:10px}.pzr-bar i{display:block;height:100%;background:var(--accent);transition:width .3s}',
    '.pzr-timer{display:flex;align-items:center;justify-content:space-between}.pzr-time{font:700 38px/1 var(--fh);font-variant-numeric:tabular-nums}',
    '.pzr-small{appearance:none;border:0;border-radius:10px;background:color-mix(in srgb,var(--text) 12%,transparent);color:var(--text);font:600 13px var(--fb);padding:8px 12px;cursor:pointer}',
    '.pzr-notes{font-size:17px;line-height:1.45;white-space:pre-wrap;max-height:32vh;overflow:auto;-webkit-user-select:text;user-select:text}',
    '.pzr-notes.empty,.pzr-upnext.empty{color:var(--muted);font-style:italic}',
    '.pzr-upnext{font:600 17px/1.3 var(--fh)}',
    '.pzr-text{font-size:15px;line-height:1.45;color:var(--muted)}',
    '.pzr-row{display:flex;align-items:center;justify-content:space-between;gap:10px}',
    '.pzr-val{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}',
    '.pzr-range{width:100%;height:36px;accent-color:var(--accent);margin-top:4px}',
    '.pzr-switch{appearance:none;border:0;width:58px;height:34px;border-radius:17px;background:color-mix(in srgb,var(--text) 22%,transparent);position:relative;cursor:pointer;flex:none}',
    '.pzr-switch i{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .15s}.pzr-switch.on{background:var(--accent)}.pzr-switch.on i{left:27px}',
    '.pzr-joy{width:min(70vw,270px);aspect-ratio:1;border-radius:50%;margin:6px auto 2px;position:relative;touch-action:none;cursor:grab;',
    'background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),var(--bg);border:2px solid color-mix(in srgb,var(--accent) 50%,transparent)}',
    '.pzr-joy:before,.pzr-joy:after{content:"";position:absolute;background:color-mix(in srgb,var(--text) 14%,transparent)}.pzr-joy:before{left:50%;top:12%;bottom:12%;width:1px}.pzr-joy:after{top:50%;left:12%;right:12%;height:1px}',
    '.pzr-knob{position:absolute;left:50%;top:50%;width:34%;height:34%;margin:-17% 0 0 -17%;border-radius:50%;background:var(--accent);box-shadow:0 8px 20px rgba(0,0,0,.35);z-index:1}',
    '.pzr-slides{display:flex;flex-direction:column;gap:2px;max-height:36vh;overflow:auto}',
    '.pzr-slides button{appearance:none;text-align:left;font:15px/1.3 var(--fb);padding:9px 10px;border-radius:10px;border:0;background:transparent;color:var(--text);cursor:pointer;display:flex;gap:10px}',
    '.pzr-slides button span{color:var(--muted);min-width:1.6em;font-variant-numeric:tabular-nums}.pzr-slides button.on{background:color-mix(in srgb,var(--accent) 26%,transparent)}',
    '.pzr-wait{margin:auto;text-align:center;color:var(--muted);font-size:15px;line-height:1.5;padding:30px 10px}',
  ].join('');

  var COLOR = /^(#[0-9a-f]{3,8}|(rgb|hsl)a?\([\d\s.,%/+-]*\))$/i;
  var FONT_NAME = /^[\w ]{1,40}$/;
  var KEYS = ['bg', 'surface', 'text', 'muted', 'accent', 'accent2'];

  function h(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function styleOnce(doc) {
    if (doc.getElementById('pzr-css')) return;
    var s = doc.createElement('style'); s.id = 'pzr-css'; s.textContent = CSS; doc.head.appendChild(s);
  }
  function applyTheme(el, theme) {
    if (!theme) return;
    var c = theme.colors || {}, f = theme.fonts || {};
    KEYS.forEach(function (k) { if (COLOR.test(String(c[k] || '').trim())) el.style.setProperty('--' + k, c[k]); });
    var stack = function (name, fb) { return FONT_NAME.test(name || '') ? '"' + name + '", ' + fb : fb; };
    el.style.setProperty('--fh', stack(f.heading, 'system-ui, sans-serif'));
    el.style.setProperty('--fb', stack(f.body, 'system-ui, sans-serif'));
    (theme.fontURLs || []).forEach(function (u) {
      if (!/^https:\/\/fonts\.googleapis\.com\/css2\?[\w=:;@,.+&%-]+$/.test(u)) return;
      if (document.querySelector('link[data-pzr-font="' + u + '"]')) return;
      var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = u; l.setAttribute('data-pzr-font', u); document.head.appendChild(l);
    });
  }
  var fmt = function (ms) { var s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  var roundTo = function (v, step) { if (!step) return v; var d = String(step).split('.')[1]; return +(Math.round(v / step) * step).toFixed(d ? d.length : 0); };

  function mount(rootEl, opts) {
    opts = opts || {};
    styleOnce(rootEl.ownerDocument);
    var el = h('div', 'pzr'), emit = opts.onEvent || function () {};
    rootEl.replaceChildren(el);
    var model = {}, key = null, dyn = [], values = {}, timerBase = null, timerOff = 0, tick = null;
    var send = function (e) { if (navigator.vibrate && !opts.preview) try { navigator.vibrate(8); } catch (x) {} emit(e); };

    function head() {
      var row = h('div', 'pzr-head'), dot = h('i', 'pzr-dot'), title = h('div', 'pzr-title'), status = h('div', 'pzr-status');
      row.append(dot, title, status);
      dyn.push(function (m) {
        title.textContent = m.title || 'Remote';
        dot.className = 'pzr-dot' + (m.status && m.status.ok ? ' ok' : '');
        status.textContent = (m.status && m.status.text) || '';
      });
      return row;
    }
    var st = function (m) { return m.state || { index: 0, count: (m.slides || []).length || 1 }; };

    var build = {
      nav: function () {
        var g = h('div', 'pzr-nav'), b = h('button', 'pzr-btn', '‹ Back'), n = h('button', 'pzr-btn accent', 'Next ›');
        b.onclick = function () { send({ k: 'prev' }); }; n.onclick = function () { send({ k: 'next' }); };
        g.append(b, n); return g;
      },
      next: function (c) { var b = h('button', 'pzr-btn accent pzr-next', c.label || 'Next'); b.onclick = function () { send({ k: 'next' }); }; return b; },
      prev: function (c) { var b = h('button', 'pzr-btn', c.label || '‹ Back'); b.onclick = function () { send({ k: 'prev' }); }; return b; },
      progress: function () {
        var card = h('div', 'pzr-card'), row = h('div', 'pzr-progress'), n = h('b'), of = h('span'), steps = h('em'), bar = h('div', 'pzr-bar'), fill = h('i');
        row.append(n, of, steps); bar.append(fill); card.append(row, bar);
        dyn.push(function (m) {
          var s = st(m);
          n.textContent = (s.index || 0) + 1; of.textContent = '/ ' + (s.count || 1);
          steps.textContent = s.steps ? 'build ' + (s.step || 0) + ' of ' + s.steps : '';
          fill.style.width = ((s.count > 1 ? (s.index || 0) / (s.count - 1) : 1) * 100) + '%';
        });
        return card;
      },
      timer: function () {
        var card = h('div', 'pzr-card'), lab = h('div', 'pzr-label', 'Elapsed'), row = h('div', 'pzr-timer'), t = h('div', 'pzr-time', '0:00'), r = h('button', 'pzr-small', 'Reset');
        r.onclick = function () { timerOff = Date.now() - (timerBase || Date.now()); };
        row.append(t, r); card.append(lab, row);
        var draw = function () { t.textContent = fmt(timerBase ? Date.now() - timerBase - timerOff : 0); };
        dyn.push(draw);
        if (!tick) tick = setInterval(function () { draw(); }, 1000);
        return card;
      },
      notes: function () {
        var card = h('div', 'pzr-card'), lab = h('div', 'pzr-label', 'Notes'), body = h('div', 'pzr-notes');
        card.append(lab, body);
        dyn.push(function (m) { var s = (m.slides || [])[st(m).index || 0]; var n = s && s.n; body.textContent = n || 'No notes for this slide.'; body.className = 'pzr-notes' + (n ? '' : ' empty'); });
        return card;
      },
      upnext: function () {
        var card = h('div', 'pzr-card'), lab = h('div', 'pzr-label', 'Up next'), body = h('div', 'pzr-upnext');
        card.append(lab, body);
        dyn.push(function (m) { var s = st(m), nx = (m.slides || [])[(s.index || 0) + 1]; body.textContent = nx ? (nx.t || 'Slide ' + ((s.index || 0) + 2)) : 'End of the talk'; body.className = 'pzr-upnext' + (nx ? '' : ' empty'); });
        return card;
      },
      slides: function () {
        var card = h('div', 'pzr-card'), lab = h('div', 'pzr-label', 'Slides'), list = h('div', 'pzr-slides');
        card.append(lab, list);
        var drawn = -1;
        dyn.push(function (m) {
          var ss = m.slides || [];
          if (drawn !== ss.length) {
            drawn = ss.length; list.replaceChildren();
            ss.forEach(function (s, i) {
              var b = h('button'); b.append(h('span', null, String(i + 1)), h('b', null, s.t || 'Slide ' + (i + 1)));
              b.onclick = function () { send({ k: 'goto', i: i }); }; list.append(b);
            });
          }
          Array.prototype.forEach.call(list.children, function (b, i) { b.classList.toggle('on', i === (st(m).index || 0)); });
        });
        return card;
      },
      text: function (c) { var card = h('div', 'pzr-card'); card.append(h('div', 'pzr-text', c.text || '')); return card; },
      slider: function (c) {
        var card = h('div', 'pzr-card'), row = h('div', 'pzr-row'), lab = h('div', 'pzr-label', c.label || c.name), val = h('span', 'pzr-val');
        var input = h('input', 'pzr-range'); input.type = 'range'; input.min = c.min; input.max = c.max; input.step = c.step || 'any';
        var v = c.name in values ? values[c.name] : c.value; input.value = v; val.textContent = roundTo(+v, c.step);
        row.append(lab, val); lab.style.margin = '0'; card.append(row, input);
        var last = 0, pending = null;
        var fire = function () { last = Date.now(); pending = null; values[c.name] = +input.value; send({ k: 'param', name: c.name, value: +input.value }); };
        input.oninput = function () {
          val.textContent = roundTo(+input.value, c.step);
          if (Date.now() - last > 70) fire(); else if (!pending) pending = setTimeout(fire, 70);

        input.onchange = fire;
        dyn.push(function (m) { var p = m.params && m.params[c.name]; if (p != null && document.activeElement !== input && +p !== +input.value) { input.value = p; val.textContent = roundTo(+p, c.step); values[c.name] = +p; } });

      },
      toggle: function (c) {
        var card = h('div', 'pzr-card pzr-row'), lab = h('div', 'pzr-label', c.label || c.name), sw = h('button', 'pzr-switch');

        } else {

      el: el,
      update: function (m) {

<script>
/* Phone remote — the phone page (remote.html). It knows nothing about any
 * particular deck: the presenting deck publishes its titles, notes, controls
 * and theme to the session, and this page renders them.
 *
 *   remote.html?s=<session>&db=<databaseURL>&k=<apiKey>&p=<projectId>[&r=<root>]   (Firebase)
 *   remote.html?local=<session>        (another window on the same computer)
 * Plain script; needs remote-link.js and remote-ui.js. */
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  if (q.has('preview')) return;      // the editor mounts its own preview here
  var local = q.has('local'), session = q.get('local') || q.get('s');
  var firebase = local ? null : { apiKey: q.get('k') || '', databaseURL: q.get('db') || '', projectId: q.get('p') || '', root: q.get('r') || '' };
  var ui = PZRemoteUI.mount(document.getElementById('app'), { onEvent: onEvent });
  var link = null, deck = null, state = null, params = {}, online = false, wasOnline = false, phone = 'phone' + Math.random().toString(36).slice(2, 10);

  function render() {
    var status = !online ? { text: wasOnline ? 'Reconnecting…' : 'Connecting…' } : { text: local ? 'This computer' : 'Live', ok: true };
    if (!deck) {
      ui.update({ status: status, controls: null, title: 'Remote',
        wait: online ? 'Waiting for the presentation — is it still open? Press R there for a fresh code.' : 'Connecting to the presentation…' });
      return;
    }
    var i = Math.min(Math.max(0, (state && state.index) || 0), (deck.slides || []).length - 1);
    var slide = (deck.slides || [])[i] || {};
    var values = {};
    for (var k in params) if (params[k] && 'v' in params[k]) values[k] = params[k].v;
    ui.update({ title: deck.title, theme: deck.theme, controls: Array.isArray(slide.r) ? slide.r : [], state: state || { index: 0, count: deck.slides.length }, slides: deck.slides, params: values, status: status });
    document.title = (deck.title || 'Remote') + ' · remote';
  }
  function onEvent(e) {
    if (!link || !online) return;
    var t = Date.now();
    if (e.k === 'param') link.set('params/' + e.name, { v: e.value, t: t });
    else if (e.k === 'joy') link.set('joy/' + e.name, { x: e.x, y: e.y, t: t });
    else link.push('cmd', Object.assign({}, e, { t: t }));
  }
  if (!PZRemoteLink.validSession(session)) {
    ui.update({ status: { text: '' }, controls: null, title: 'Remote', wait: 'Scan the code on the presenter’s screen (press R there).' });
    return;
  }
  render();
  PZRemoteLink.connect({ firebase: firebase, session: session, local: local, role: 'phone' }).then(function (l) {
    link = l;
    l.onConnected(function (ok) {
      online = ok; if (ok) wasOnline = true;
      if (ok) { l.set('phones/' + phone, Date.now()); l.removeOnDisconnect('phones/' + phone); }
      render();
    });
    l.onValue('deck', function (d) { deck = d && typeof d === 'object' ? d : null; render(); });
    l.onValue('state', function (s) { state = s && typeof s === 'object' ? s : null; render(); });
    l.onValue('params', function (p) { params = p && typeof p === 'object' ? p : {}; render(); });
  }).catch(function (e) { ui.update({ status: { text: 'Not connected' }, controls: null, wait: e.message }); });
})();

</script>
