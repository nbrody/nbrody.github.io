<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphics Studio — Playlists & Remote</title>
  <meta name="description"
    content="Build playlists of interactive math & generative visualizations and drive them with a remote control.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="app/style.css">
  <style>
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem 1.4rem;
      margin: 0;
      border-radius: 0;
      border-left: none;
      border-right: none;
      border-top: none;
    }
    .brand { font-size: 1.15rem; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 0.5rem; }
    .brand b { color: var(--accent); }
    #plJump { display: none; }
    @media (max-width: 940px) { #plJump { display: inline-flex; } }
    @media (max-width: 600px) {
      .topbar { flex-wrap: wrap; padding: 0.7rem 1rem; gap: 0.5rem; }
      .topbar .chip, .topbar .spacer { display: none; }
      .brand { flex: 1 0 100%; }
      .topbar .btn { padding: 0.4rem 0.6rem; font-size: 0.8rem; }
      main.layout { padding: 1rem; }
    }
    .brand .glyph {
      font-size: 1.3rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1.2rem;
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.4rem;
      align-items: start;
    }
    @media (max-width: 940px) { .layout { grid-template-columns: 1fr; } }

    .library { padding-bottom: 3rem; min-width: 0; }
    .lib-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem 0.8rem; margin: 0.4rem 0 1rem; }
    .lib-head h1 { font-size: 1.5rem; }
    .lib-head p { margin: 0; }

    /* toolbar: search, category filters, view toggle */
    .lib-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }
    .lib-tools input[type='search'] {
      flex: 1 1 220px; min-width: 0; padding: 0.55rem 0.8rem; border-radius: var(--radius-sm);
      border: 1px solid var(--stroke-strong); background: rgba(255, 255, 255, 0.04); font-size: 0.9rem;
    }
    .lib-tools input[type='search']:focus { outline: none; border-color: var(--accent); }
    .filters { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .filter {
      display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.7rem; border-radius: 999px;
      border: 1px solid var(--stroke); background: transparent; font-size: 0.78rem; color: var(--ink-dim); cursor: pointer;
    }
    .filter::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--cat, var(--ink-faint)); }
    .filter:hover { color: var(--ink); border-color: var(--stroke-strong); }
    .filter[aria-pressed='true'] { color: var(--ink); border-color: var(--cat, var(--accent)); background: color-mix(in srgb, var(--cat, var(--accent)) 16%, transparent); }
    .view-toggle { display: inline-flex; border: 1px solid var(--stroke-strong); border-radius: var(--radius-sm); overflow: hidden; }
    .view-toggle button { background: none; border: 0; padding: 0.45rem 0.65rem; cursor: pointer; color: var(--ink-dim); font-size: 0.85rem; }
    .view-toggle button[aria-pressed='true'] { background: rgba(255, 255, 255, 0.1); color: var(--ink); }

    .cat-title {
      display: flex; align-items: center; gap: 0.6rem;
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--ink-dim); margin: 1.4rem 0 0.7rem;
    }
    .cat-title::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--cat, var(--accent)); box-shadow: 0 0 12px var(--cat, var(--accent)); }
    .cat-title .n { color: var(--ink-faint); letter-spacing: 0.05em; }
    .no-results { color: var(--ink-faint); padding: 2rem 0; text-align: center; }

    /* grid view */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.9rem; }
    .card {
      position: relative; display: flex; flex-direction: column;
      border-radius: var(--radius); border: 1px solid var(--stroke); overflow: hidden;
      background: linear-gradient(160deg, color-mix(in srgb, var(--cat) 18%, transparent), rgba(13, 15, 23, 0.6));
      transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
    }
    .card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--cat) 60%, var(--stroke)); box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5); }
    .thumb {
      position: relative; display: block; aspect-ratio: 16 / 10; overflow: hidden;
      background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--cat) 30%, transparent), rgba(7, 8, 13, 0.9));
    }
    .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .card:hover .thumb img { transform: scale(1.04); }
    .thumb .glyph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2.4rem; filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.5)); }
    .thumb img + .glyph { display: none; }
    .thumb .in-pl {
      position: absolute; top: 0.45rem; left: 0.45rem; padding: 0.1rem 0.45rem; border-radius: 999px;
      font-size: 0.7rem; font-weight: 600; background: rgba(7, 8, 13, 0.75); color: var(--ok); backdrop-filter: blur(4px);
    }
    .card .meta { flex: 1; padding: 0.6rem 0.75rem 0.5rem; border-top: 1px solid var(--stroke); background: rgba(7, 8, 13, 0.5); }
    .card .name { display: block; font-weight: 600; font-size: 0.93rem; color: var(--ink); }
    .card .name:hover { color: var(--accent); text-decoration: none; }
    .card .blurb { font-size: 0.75rem; color: var(--ink-dim); margin-top: 0.2rem; line-height: 1.35; }
    .card .links { display: flex; align-items: center; gap: 0.3rem; padding: 0 0.6rem 0.6rem; background: rgba(7, 8, 13, 0.5); }

    /* small link/action buttons shared by grid + list */
    .path { font-family: var(--mono); font-size: 0.7rem; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.3rem; flex: none;
      height: 1.9rem; min-width: 1.9rem; padding: 0 0.5rem; border-radius: 8px;
      border: 1px solid var(--stroke); background: rgba(255, 255, 255, 0.04);
      color: var(--ink-dim); font-size: 0.78rem; cursor: pointer; text-decoration: none;
    }
    .mini:hover { color: var(--ink); border-color: var(--stroke-strong); background: rgba(255, 255, 255, 0.09); text-decoration: none; }
    .mini.add { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 45%, var(--stroke)); }
    .mini.add:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); }

    /* list view */
    .rows { display: flex; flex-direction: column; gap: 0.35rem; }
    .vrow {
      display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; align-items: center; gap: 0.8rem;
      padding: 0.35rem 0.5rem 0.35rem 0.35rem; border-radius: var(--radius-sm); border: 1px solid var(--stroke);
      background: rgba(255, 255, 255, 0.025);
    }
    .vrow:hover { border-color: color-mix(in srgb, var(--cat) 50%, var(--stroke)); background: rgba(255, 255, 255, 0.05); }
    .vrow .thumb { border-radius: 6px; }
    .vrow .thumb .glyph { font-size: 1.3rem; }
    .vrow .name { font-weight: 600; font-size: 0.9rem; color: var(--ink); }
    .vrow .name:hover { color: var(--accent); text-decoration: none; }
    .vrow .blurb { font-size: 0.75rem; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vrow .links { display: flex; gap: 0.3rem; }
    @media (max-width: 560px) {
      .vrow { grid-template-columns: 64px minmax(0, 1fr); }
      .vrow .links { grid-column: 1 / -1; justify-content: flex-end; }
    }

    /* editor */
    .editor { position: sticky; top: 70px; padding: 1rem; display: flex; flex-direction: column; gap: 0.9rem; max-height: calc(100vh - 90px); }
    .editor h2 { font-size: 1.05rem; }
    @media (max-width: 940px) { .editor { position: static; max-height: none; } .editor .items { max-height: 50vh; } }
    .pl-picker { display: flex; gap: 0.5rem; }
    .pl-picker select { flex: 1; }
    .pl-settings { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem 0.8rem; align-items: center; font-size: 0.85rem; }
    .pl-settings label { color: var(--ink-dim); }
    .pl-settings .full { grid-column: 1 / -1; }
    .pl-name { font-size: 1rem; font-weight: 600; }

    .items { display: flex; flex-direction: column; gap: 0.4rem; overflow-y: auto; flex: 1; min-height: 60px; padding-right: 2px; }
    .pl-item { display: flex; align-items: center; gap: 0.55rem; padding: 0.45rem 0.55rem; border-radius: var(--radius-sm); border: 1px solid var(--stroke); background: rgba(255, 255, 255, 0.03); }
    .pl-item .idx { color: var(--ink-faint); font-size: 0.72rem; width: 1.2rem; text-align: right; font-family: var(--mono); }
    .pl-item .g { width: 40px; height: 25px; flex: none; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; background: rgba(255, 255, 255, 0.05); }
    .pl-item .g img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pl-item .t { flex: 1; min-width: 0; color: var(--ink); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-item .ord { display: flex; flex-direction: column; }
    .pl-item .ord button, .pl-item .x { background: none; border: none; color: var(--ink-faint); cursor: pointer; padding: 0 0.2rem; line-height: 1; font-size: 0.8rem; }
    .pl-item .ord button:hover, .pl-item .x:hover { color: var(--ink); }
    .pl-item.dragover { border-color: var(--accent); }
    .empty-hint { color: var(--ink-faint); font-size: 0.85rem; text-align: center; padding: 1.4rem 0.6rem; border: 1px dashed var(--stroke); border-radius: var(--radius-sm); }

    .pl-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .pl-actions .full { grid-column: 1 / -1; }

    dialog { background: var(--panel-solid); color: var(--ink); border: 1px solid var(--stroke-strong); border-radius: var(--radius); padding: 1.2rem; max-width: 520px; width: 92vw; box-shadow: var(--shadow); }
    dialog::backdrop { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px); }
    dialog textarea { min-height: 200px; font-family: var(--mono); font-size: 0.8rem; resize: vertical; }
  </style>
</head>

<body class="wrapper">
  <header class="topbar glass">
    <div class="brand"><span class="glyph">◧</span> Graphics <b>Studio</b></div>
    <span class="chip" title="Playlists are stored locally in this browser">local</span>
    <div class="spacer"></div>
    <a class="btn ghost" href="#editor" id="plJump" title="Jump to the playlist editor">▤ Playlist</a>
    <button class="btn ghost" id="importBtn">⇪ Import</button>
    <button class="btn" id="newPlBtn">+ New playlist</button>
    <a class="btn ghost" href="../index.html" title="Back to nbrody.github.io">↩ Site</a>
  </header>

  <main class="layout">
    <section class="library">
      <div class="lib-head">
        <h1>Visualization library</h1>
        <p class="muted">Open any visualization directly, or add it to a playlist and drive it from the stage or a remote.</p>
      </div>
      <div class="lib-tools">
        <input type="search" id="search" placeholder="Search visualizations…" aria-label="Search visualizations" autocomplete="off">
        <div class="view-toggle" role="group" aria-label="Layout">
          <button type="button" data-view="grid" title="Thumbnail grid">▦ Grid</button>
          <button type="button" data-view="list" title="Compact list">☰ List</button>
        </div>
      </div>
      <div class="filters" id="filters"></div>
      <div id="catalog"><!-- categories + cards injected by gallery.js --></div>
    </section>

    <aside class="editor glass" id="editor"><!-- playlist editor injected by gallery.js --></aside>
  </main>

  <div id="toast"></div>

  <dialog id="importDialog">
    <h2 style="margin-bottom:0.6rem">Import playlists</h2>
    <p class="muted" style="font-size:0.85rem;margin:0 0 0.6rem">Paste exported playlist JSON (a single playlist or an array). Unknown visualizations are skipped.</p>
    <textarea id="importText" placeholder="Paste JSON here…"></textarea>
    <div class="row" style="margin-top:0.8rem;justify-content:flex-end">
      <button class="btn ghost" id="importCancel">Cancel</button>
      <button class="btn primary" id="importConfirm">Import</button>
    </div>
  </dialog>

  <script type="module" src="app/gallery.js"></script>
</body>

</html>
