<!doctype html>
<html lang="en">
<head>
<script src="../app/entry.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Passiflora caerulea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #2e3129; overflow: hidden; }
    #scene { display: block; width: 100%; height: 100%; touch-action: none; }
    .caption {
      position: fixed; left: 24px; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 500;
      color: rgba(244, 242, 255, 0.86); font-size: 22px; letter-spacing: 0.01em;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4); pointer-events: none;
    }
    .caption small { display: block; font-size: 14px; opacity: 0.7; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="A 3D blue passionflower you can drag to look around"></canvas>
  <p class="caption">Passiflora caerulea<small>Drag to look around, scroll to zoom</small></p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
