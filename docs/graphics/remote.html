<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05070f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Remote — Graphics Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="app/style.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body.remote-app {
      height: 100dvh; display: flex; justify-content: center;
      background:
        radial-gradient(900px 520px at 10% -12%, rgba(129, 140, 248, 0.16), transparent 60%),
        radial-gradient(700px 480px at 110% 0%, rgba(34, 211, 238, 0.09), transparent 55%),
        linear-gradient(180deg, var(--bg-2), var(--bg));
      overscroll-behavior: none;
    }
    .app { position: relative; width: 100%; max-width: 560px; height: 100%; display: flex; flex-direction: column; min-height: 0; }

    /* ── now-playing header ── */
    .r-head {
      position: relative; flex: none; display: flex; align-items: center; gap: 12px;
      padding: calc(12px + env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 12px max(14px, env(safe-area-inset-left));
    }
    .r-glyph {
      width: 46px; height: 46px; flex: none; display: grid; place-items: center; font-size: 24px; border-radius: 14px;
      background: linear-gradient(160deg, rgba(129, 140, 248, 0.22), rgba(34, 211, 238, 0.08));
      border: 1px solid var(--accent-line); box-shadow: 0 0 18px var(--accent-glow);
    }
    .r-meta { flex: 1; min-width: 0; }
    .r-title { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r-sub { display: flex; align-items: center; gap: 7px; margin-top: 3px; font-size: 12px; color: var(--ink-dim); min-width: 0; }
    .r-sub span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--ink-faint); transition: background 0.2s, box-shadow 0.2s; }
    .status-dot.live { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
    .status-dot.waiting { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
    .r-progress { position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px; border-radius: 2px; background: var(--w05); overflow: hidden; }
    .r-progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.25s linear; }

    /* ── tabs float as one segmented bar ── */
    .app > .seg-tabs { margin: 10px 12px 0; border: 1px solid var(--stroke); border-radius: var(--r-lg); padding: 5px; gap: 4px; }
    .app > .seg-tabs .seg-tab { flex: 1 1 auto; min-height: 42px; padding: 0 8px; font-size: 13.5px; }
    @media (max-width: 360px) {
      .app > .seg-tabs { gap: 2px; }
      .app > .seg-tabs .seg-tab { font-size: 12.5px; padding: 0 3px; }
      .app > .seg-tabs .seg-tab .count { display: none; }
    }

    .pager > .page { padding: 14px max(14px, env(safe-area-inset-right)) 28px max(14px, env(safe-area-inset-left)); }

    /* ── bottom transport dock (thumb zone) ── */
    .r-dock {
      flex: none; display: flex; align-items: center; justify-content: space-evenly; gap: 6px;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--stroke); background: rgba(5, 7, 15, 0.82);
      backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
    }
    .dock-btn { width: 50px; height: 50px; min-width: 50px; }
    .dock-btn svg { width: 22px; height: 22px; }
    .dock-play {
      width: 66px; height: 66px; min-width: 66px; border-color: rgba(255, 255, 255, 0.2); color: #fff;
      background: linear-gradient(180deg, #8b93fa, #5d63e6); box-shadow: 0 0 22px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    .dock-play:hover { color: #fff; filter: brightness(1.08); background: linear-gradient(180deg, #8b93fa, #5d63e6); }
    .dock-play svg { width: 26px; height: 26px; }

    /* ── pages ── */
    .disconnected { text-align: center; align-items: center; }
    .disconnected p { margin: 0; color: var(--ink-dim); font-size: 13.5px; line-height: 1.55; }
    .disconnected .btn { min-height: 46px; padding: 0 1.2rem; }

    .playlist-jump { position: relative; display: flex; flex-direction: column; gap: 6px; max-height: 44vh; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
    .jump {
      display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 6px 12px; text-align: left;
      border-radius: var(--r-md); border: 1px solid transparent; background: var(--w03); color: inherit; cursor: pointer; font-size: 14px;
    }
    .jump:hover { background: var(--w08); }
    .jump.active { border-color: var(--accent-line); background: linear-gradient(180deg, var(--accent-soft), rgba(129, 140, 248, 0.06)); box-shadow: 0 0 12px var(--accent-glow); }
    .jump .n { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); width: 1.6rem; flex: none; }
    .jump .g { font-size: 1.15rem; flex: none; }
    .jump .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #toast { bottom: calc(104px + env(safe-area-inset-bottom)); } /* above the transport dock */
    .r-foot { margin: 0; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); overflow-wrap: anywhere; }

    /* ── "more" bottom sheet ── */
    dialog.sheet {
      position: fixed; inset: auto 0 0 0; margin: 0 auto; width: min(560px, 100%); max-width: 100%; max-height: 85dvh;
      padding: 8px 14px calc(16px + env(safe-area-inset-bottom)); color: var(--ink);
      border-radius: var(--r-xl) var(--r-xl) 0 0; border-bottom: none;
    }
    dialog.sheet[open] { animation: sheet-in 0.28s var(--ease-out); }
    dialog.sheet::backdrop { background: rgba(2, 3, 8, 0.55); backdrop-filter: blur(2px); }
    @keyframes sheet-in { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
    .sheet-grip { width: 38px; height: 4px; border-radius: 4px; background: var(--w12); margin: 4px auto 12px; }
    .sheet-list { display: flex; flex-direction: column; gap: 8px; }
    .sheet-list .tbtn { justify-content: flex-start; gap: 12px; font-size: 15px; }
    .sheet-list .tbtn .ic { width: 22px; text-align: center; color: var(--accent); font-size: 17px; }
    .sheet-list .tbtn .hint { margin-left: auto; font-size: 12px; color: var(--ink-faint); }

    /* playlist editor cards */
    .editor { display: flex; flex-direction: column; gap: 12px; }
    .editor-items { display: flex; flex-direction: column; gap: 8px; }
    .editor-item { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--stroke); border-radius: var(--r-md); background: rgba(0, 0, 0, 0.18); }
    .editor-item strong { font-size: 14px; font-weight: 550; }
    .editor-item details summary { cursor: pointer; font-size: 12.5px; color: var(--ink-dim); padding: 4px 0; }
    .editor hr { border: none; border-top: 1px solid var(--stroke); margin: 2px 0; width: 100%; }
    .editor [role='status']:empty { display: none; }
    .editor [role='status'] { margin: 0; font-size: 13px; color: var(--accent-2); }
    .editor .pc-sub { font-size: 12px; }
    textarea { font-family: var(--mono); }
    @media (pointer: fine) { textarea { font-size: 12.5px; } } /* touch keeps 16px so iOS doesn't zoom */
    .editor input[type='file'] { font-size: 12.5px; color: var(--ink-dim); }
  </style>
</head>

<body class="remote-app">
  <div class="app">
    <header class="r-head">
      <div class="r-glyph" id="nowGlyph" aria-hidden="true">✦</div>
      <div class="r-meta">
        <div class="r-title" id="nowTitle">Remote</div>
        <div class="r-sub"><span class="status-dot" id="statusDot"></span><span id="statusText">connecting…</span></div>
      </div>
      <a class="icon-btn" href="index.html" title="Library" aria-label="Library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg>
      </a>
      <div class="r-progress" aria-hidden="true"><i id="nowBar"></i></div>
    </header>

    <nav class="seg-tabs" role="tablist" aria-label="Remote pages" id="tabs">
      <button class="seg-tab" role="tab" type="button">Simple</button>
      <button class="seg-tab" role="tab" type="button">Advanced <span class="count" id="advCount" hidden></span></button>
      <button class="seg-tab" role="tab" type="button">Playlist</button>
      <button class="seg-tab" role="tab" type="button">Connect</button>
    </nav>

    <main class="pager" id="pager">
      <section class="page" id="page-simple">
        <div id="disconnected" class="pc-card disconnected hidden">
          <div class="pc-label">No display connected</div>
          <p>Open a display here, or scan the pairing QR code on a display to control it from this phone.</p>
          <button class="btn primary" id="openStageBtn" type="button">Open the display</button>
          <button class="btn ghost" id="toConnect" type="button">Pair with another display →</button>
        </div>
        <div id="simpleControls"></div>
      </section>

      <section class="page" id="page-advanced">
        <div id="controls"></div>
      </section>

      <section class="page" id="page-playlist">
        <div class="pc-card">
          <div class="pc-label">Queue</div>
          <div class="playlist-jump" id="jump"></div>
        </div>
        <div class="editor" id="playlistEditor"></div>
      </section>

      <section class="page" id="page-connect">
        <div class="pc-card">
          <div class="pc-label">Connect a phone</div>
          <div class="pairing-fields" id="phonePairing"></div>
        </div>
        <p class="r-foot" id="footer">transport: —</p>
      </section>
    </main>

    <footer class="r-dock" aria-label="Playback">
      <button class="icon-btn dock-btn" id="randomBtn" type="button" title="Random visualization" aria-label="Random visualization">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><g fill="currentColor"><circle cx="9" cy="9" r="1.45"/><circle cx="15" cy="9" r="1.45"/><circle cx="12" cy="12" r="1.45"/><circle cx="9" cy="15" r="1.45"/><circle cx="15" cy="15" r="1.45"/></g></svg>
      </button>
      <button class="icon-btn dock-btn" id="prevBtn" type="button" title="Previous" aria-label="Previous visualization">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="2.4" height="14" rx="1"/><path d="M19 5.8v12.4a.9.9 0 0 1-1.4.75L9.2 12.75a.9.9 0 0 1 0-1.5l8.4-6.2a.9.9 0 0 1 1.4.75z"/></svg>
      </button>
      <button class="icon-btn dock-play" id="playBtn" type="button" title="Play / pause" aria-label="Play">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6z"/></svg>
      </button>
      <button class="icon-btn dock-btn" id="nextBtn" type="button" title="Next" aria-label="Next visualization">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="16.6" y="5" width="2.4" height="14" rx="1"/><path d="M5 5.8v12.4a.9.9 0 0 0 1.4.75l8.4-6.2a.9.9 0 0 0 0-1.5L6.4 5.05A.9.9 0 0 0 5 5.8z"/></svg>
      </button>
      <button class="icon-btn dock-btn" id="moreBtn" type="button" title="Display options" aria-label="Display options" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="18.5" cy="12" r="1.9"/></svg>
      </button>
    </footer>
  </div>

  <dialog class="sheet pc-glass" id="moreSheet" aria-labelledby="moreTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="pc-label" id="moreTitle" style="margin: 0 2px 10px">Display</div>
    <div class="sheet-list">
      <button class="tbtn" id="uPanel" type="button"><span class="ic" aria-hidden="true">▤</span><span id="uPanelLabel">Show controls on the display</span></button>
      <button class="tbtn" id="uReload" type="button"><span class="ic" aria-hidden="true">↻</span><span>Reload this visualization</span></button>
      <button class="tbtn" id="uFs" type="button"><span class="ic" aria-hidden="true">⛶</span><span>Fullscreen the display</span><span class="hint">may need a click there</span></button>
      <button class="tbtn" id="uShuffle" type="button"><span class="ic" aria-hidden="true">⤨</span><span>Shuffle the queue</span></button>
      <a class="tbtn" href="index.html" style="text-decoration:none"><span class="ic" aria-hidden="true">◧</span><span>Open the library</span></a>
      <button class="btn ghost" id="moreClose" type="button" style="min-height:46px">Close</button>
    </div>
  </dialog>

  <div id="toast" aria-live="polite"></div>

  <script type="module" src="app/remote.js"></script>
</body>

</html>
