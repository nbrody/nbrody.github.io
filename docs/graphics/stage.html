<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage — Graphics Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="app/style.css">
  <style>
    html, body { height: 100%; overflow: hidden; background: #000; }

    #viz {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: 0; background: #000; display: block;
    }

    /* cross-fade cover shown while a visualization loads */
    #transition {
      position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.8rem;
      background: radial-gradient(800px 500px at 50% 40%, #11141d, #05060a);
      opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
    }
    #transition.show { opacity: 1; pointer-events: all; }
    #transition .g { font-size: 4rem; filter: drop-shadow(0 6px 24px rgba(0,0,0,0.6)); }
    #transition .t { font-size: 1.2rem; color: var(--ink-dim); letter-spacing: 0.02em; }
    .spin { width: 26px; height: 26px; border: 2px solid var(--stroke-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* bottom dock */
    #dock {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      z-index: 40; display: flex; align-items: center; gap: 0.7rem;
      padding: 0.55rem 0.8rem; max-width: min(960px, 94vw);
      transition: opacity 0.3s, transform 0.3s;
    }
    #dock.hide { opacity: 0; transform: translateX(-50%) translateY(20px); pointer-events: none; }
    #dock .now { display: flex; flex-direction: column; min-width: 0; }
    #dock .now .name { font-size: 0.92rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #dock .now .sub { font-size: 0.72rem; color: var(--ink-faint); font-family: var(--mono); }
    #dock .transport { display: flex; align-items: center; gap: 0.35rem; }
    #dock .progress { width: 160px; height: 5px; border-radius: 999px; background: rgba(255,255,255,0.14); overflow: hidden; }
    #dock .progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.2s linear; }
    #dock .count { font-size: 0.74rem; color: var(--ink-dim); font-family: var(--mono); white-space: nowrap; }
    .divider { width: 1px; height: 26px; background: var(--stroke); }

    /* on-stage overlay remote */
    #panel {
      position: fixed; top: 0; right: 0; z-index: 45; height: 100%;
      width: min(360px, 92vw); display: flex; flex-direction: column;
      border-radius: 0; border-top: none; border-bottom: none; border-right: none;
      transform: translateX(100%); transition: transform 0.28s ease;
    }
    #panel.open { transform: translateX(0); }
    #panel header { padding: 0.9rem 1rem; border-bottom: 1px solid var(--stroke); display: flex; align-items: center; gap: 0.6rem; }
    #panel header .g { font-size: 1.5rem; }
    #panel header .meta { min-width: 0; }
    #panel header .meta .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #panel header .meta .sub { font-size: 0.72rem; color: var(--ink-faint); }
    #panel .body { flex: 1; overflow-y: auto; padding: 0.9rem 1rem 2rem; display: flex; flex-direction: column; gap: 0.8rem; }
    #panel .util { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }

    /* shared controlsView styling */
    .cv-fields { display: flex; flex-direction: column; gap: 0.7rem; }
    .cv-field { display: flex; flex-direction: column; gap: 0.3rem; }
    .cv-field.toggle { flex-direction: row; align-items: center; justify-content: space-between; }
    .cv-field label { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .cv-label { font-size: 0.82rem; color: var(--ink-dim); }
    .cv-badge { font-size: 0.72rem; font-family: var(--mono); color: var(--ink); background: rgba(255,255,255,0.07); padding: 0.05rem 0.4rem; border-radius: 6px; }
    .cv-section { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-faint); margin-top: 0.4rem; }
    .cv-buttons, .cv-keys { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .cv-keys .key { font-family: var(--mono); min-width: 2.2rem; }
    .cv-empty { color: var(--ink-faint); font-size: 0.85rem; padding: 0.6rem 0; }

    #hint { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 40; font-size: 0.78rem; color: var(--ink-dim); padding: 0.4rem 0.8rem; transition: opacity 0.4s; }
    #hint.hide { opacity: 0; }
  </style>
</head>

<body>
  <iframe id="viz" title="visualization" allow="fullscreen; autoplay; xr-spatial-tracking; accelerometer; gyroscope"></iframe>

  <div id="transition">
    <div class="g" id="trGlyph">✦</div>
    <div class="spin"></div>
    <div class="t" id="trTitle">Loading…</div>
  </div>

  <div id="hint" class="glass">← → switch · Space play/pause · <b>C</b> controls · <b>F</b> fullscreen</div>

  <div id="dock" class="glass">
    <button class="btn ghost icon" id="exitBtn" title="Back to library">↩</button>
    <div class="divider"></div>
    <div class="now">
      <span class="name" id="dockTitle">—</span>
      <span class="sub" id="dockPlaylist">—</span>
    </div>
    <div class="divider"></div>
    <div class="transport">
      <button class="btn icon" id="prevBtn" title="Previous (←)">⏮</button>
      <button class="btn primary icon" id="playBtn" title="Play / pause (Space)">▶</button>
      <button class="btn icon" id="nextBtn" title="Next (→)">⏭</button>
    </div>
    <div class="progress" title="Auto-advance progress"><i id="progressFill"></i></div>
    <span class="count" id="count">0 / 0</span>
    <div class="divider"></div>
    <button class="btn icon" id="panelBtn" title="Controls (C)">🎛</button>
    <button class="btn icon" id="remoteBtn" title="Open remote in a new window">🕹</button>
    <button class="btn icon" id="fsBtn" title="Fullscreen (F)">⛶</button>
  </div>

  <aside id="panel" class="glass">
    <header>
      <span class="g" id="panelGlyph">✦</span>
      <div class="meta">
        <div class="name" id="panelTitle">—</div>
        <div class="sub" id="panelSub">on-stage remote</div>
      </div>
      <div class="spacer"></div>
      <button class="btn ghost icon" id="panelClose" title="Close">✕</button>
    </header>
    <div class="body scroll">
      <div class="util">
        <button class="btn" id="uPanel" title="Toggle the visualization's own panel">▤ Panel</button>
        <button class="btn" id="uReload" title="Reload this visualization">↻ Reload</button>
        <button class="btn" id="uRemote" title="Open the full remote in a new window">🕹 Pop out</button>
      </div>
      <div id="controls"><!-- auto-generated controls injected here --></div>
    </div>
  </aside>

  <div id="toast"></div>

  <script type="module" src="app/stage.js"></script>
</body>

</html>
