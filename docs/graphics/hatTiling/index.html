<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../app/entry.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hat Monotile — An Aperiodic Tour</title>
    <meta name="description"
        content="A looping animated tour of the Hat aperiodic monotile: growth and shrinking, which neighbours are possible, mirror images, supertiles, Fibonacci squares, near-periods and the Tile(a,b) family.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="underCanvas"></canvas>
    <canvas id="tilingCanvas"></canvas>
    <canvas id="overlayCanvas"></canvas>

    <div id="loading" class="loading">Building 7,921 hats…</div>

    <!-- Control Panel -->
    <button id="panelToggle" class="panel-toggle" aria-label="Show controls" title="Show controls (H)">☰</button>
    <div id="controls" class="controls">
        <button id="panelClose" class="panel-close" aria-label="Hide controls" title="Hide controls (H)">×</button>
        <h1 id="title">Hat Monotile</h1>
        <div class="subtitle">
            An aperiodic tour<br>
            <a href="https://cs.uwaterloo.ca/~csk/hat/" target="_blank" rel="noopener">Smith, Myers, Kaplan &amp;
                Goodman-Strauss (2023)</a>
        </div>

        <div class="section-label">Tour</div>

        <div class="control-group toggle-row">
            <label for="tourToggle">Play tour</label>
            <input type="checkbox" id="tourToggle" checked>
        </div>

        <div class="control-group">
            <label for="chapterSelect">Chapter</label>
            <select id="chapterSelect"></select>
        </div>

        <div class="control-group">
            <div class="button-row">
                <button id="prevBtn" class="small-btn" title="Previous chapter (←)">← Prev</button>
                <button id="nextBtn" class="small-btn" title="Next chapter (→)">Next →</button>
            </div>
        </div>

        <div class="control-group">
            <label for="speedSlider">Tour Speed <span id="speedValue" class="value-badge">1.00×</span></label>
            <input type="range" id="speedSlider" min="0.25" max="2" step="0.05" value="1">
        </div>

        <div class="control-group toggle-row">
            <label for="captionsToggle">Captions</label>
            <input type="checkbox" id="captionsToggle" checked>
        </div>

        <div class="section-label">Look</div>

        <div class="control-group">
            <label>Color Scheme</label>
            <div class="color-swatch-row" id="paletteSwatches"></div>
        </div>

        <div class="control-group">
            <label for="strokeSlider">Stroke Width <span id="strokeValue" class="value-badge">1.0</span></label>
            <input type="range" id="strokeSlider" min="0" max="3" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label for="bgPicker">Background</label>
            <input type="color" id="bgPicker" value="#0a0a1a">
        </div>

        <div class="control-group toggle-row">
            <label for="drawOutlinesToggle">Supertile Outlines</label>
            <input type="checkbox" id="drawOutlinesToggle">
        </div>

        <div class="stats" id="stats">
            <span id="tileCount">0 hats</span>
            <span id="resolution">1920×1080</span>
        </div>

        <button id="screenshotBtn" class="screenshot-btn">📸 Screenshot</button>
        <button id="resetBtn" class="reset-btn">↺ Reset View</button>
    </div>

    <!-- Caption card: chapter, explanation, live readout, timeline -->
    <div id="tourCaption" class="tour-caption" aria-live="polite">
        <div class="cap-head">
            <button id="capPrev" class="cap-btn" aria-label="Previous chapter">‹</button>
            <button id="playBtn" class="cap-btn play" aria-label="Pause tour">❚❚</button>
            <button id="capNext" class="cap-btn" aria-label="Next chapter">›</button>
            <span id="capNum" class="cap-num">01 / 11</span>
            <span id="capTitle" class="cap-title">The hat</span>
        </div>
        <p id="capText" class="cap-text"></p>
        <div id="capStat" class="cap-stat"></div>
        <div id="capProgress" class="cap-progress"></div>
    </div>

    <!-- Instructions overlay -->
    <div id="instructions" class="instructions">
        <span>Drag to pan · Scroll to zoom · <kbd>Space</kbd> pause · <kbd>←</kbd>/<kbd>→</kbd> chapters ·
            <kbd>T</kbd> captions · <kbd>H</kbd> panel</span>
    </div>

    <script src="geometry.js"></script>
    <script src="hat.js"></script>
    <script src="analysis.js"></script>
    <script src="gl.js"></script>
    <script src="tour.js"></script>
    <script src="renderer.js"></script>
</body>

</html>
