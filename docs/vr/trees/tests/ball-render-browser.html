<!doctype html><meta charset="utf-8"><title>Ball renderer animation check</title>
<p id="result">Running ball renderer checks…</p><pre id="details"></pre>
<script type="importmap">{"imports":{"three":"../../../GeometryofLinearGroups/Geometric/Tools/Kleinian/vendor/three/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {createBallScene} from '../js/ballRender.js';
import {baseBall} from '../js/ballTree.js';
const result=document.querySelector('#result'),details=document.querySelector('#details');
try{
 const base=baseBall(),child={...base,c:[2,0,0],R:.1};
 const records=[{F:base,gap:0,depth:0,labels:[]},{F:child,gap:0,depth:1,labels:[]}];
 const view=createBallScene({recs:records,field:'i'});view.group.updateMatrixWorld(true);
 const r=new THREE.Raycaster(new THREE.Vector3(0,0,3),new THREE.Vector3(0,0,-1));
 const before=view.vertexOfHit(r.intersectObjects(view.meshes,false)[0]);
 const circleLines=view.group.children.filter(x=>x.isLineSegments)[1].geometry;
 const original=Array.from(circleLines.getAttribute('position').array.slice(0,48));
 const T=[[1,0],[.5,.25],[0,0],[1,0]];
 view.update([{...records[0],F:{...base,c:[3,0,0]},C:T,targetDepth:1,colorMix:1},{...records[1],F:{...child,c:[0,0,0]}}],{animating:true});view.group.updateMatrixWorld(true);
 const after=view.vertexOfHit(r.intersectObjects(view.meshes,false)[0]);
 const changed=Array.from(circleLines.getAttribute('position').array.slice(0,48)).some((v,i)=>Math.abs(v-original[i])>1e-6);
 const actual=new THREE.Color();view.meshes[0].getColorAt(0,actual);const expected=new THREE.Color(0x94d7c6);
 const colorCorrect=Math.abs(actual.r-expected.r)<1e-6&&Math.abs(actual.g-expected.g)<1e-6&&Math.abs(actual.b-expected.b)<1e-6;
 const pass=before===0&&after===1&&changed&&colorCorrect;
 result.textContent=pass?'PASS: instance raycasts and moved boundary geometry':'FAIL: ball renderer update';
 details.textContent=JSON.stringify({before,after,changed,colorCorrect},null,2);view.dispose();
}catch(e){result.textContent='FAIL: '+e.message;details.textContent=e.stack;}
</script>
