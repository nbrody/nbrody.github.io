name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Generate seminar browser configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.GOLGF26_FIREBASE_CONFIG }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          if (!process.env.FIREBASE_CONFIG) throw new Error('GOLGF26_FIREBASE_CONFIG is required');
          const config = JSON.parse(process.env.FIREBASE_CONFIG);
          if (config.projectId !== 'golgf26' || typeof config.apiKey !== 'string' || !config.apiKey) {
            throw new Error('Invalid seminar Firebase configuration');
          }
          fs.writeFileSync('docs/GOLGFall26/firebase-config.js',
            '// Generated at deployment. Firebase browser configuration is public.\n' +
            'export const firebaseConfig = ' + JSON.stringify(config, null, 2) + ';\n');
          JS
      # Pages paths are case-sensitive. A GoLGFall26 folder can't sit beside GOLGFall26 in a
      # checkout on a case-insensitive disk, so the redirect page is generated here instead.
      - name: Redirect /GoLGFall26/ to the seminar page
        run: |
          mkdir -p docs/GoLGFall26
          cat > docs/GoLGFall26/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><title>Geometry of Linear Groups · Fall 2026</title>
          <link rel="canonical" href="https://nbrody.github.io/GOLGFall26/">
          <meta http-equiv="refresh" content="0; url=/GOLGFall26/">
          <script>location.replace('/GOLGFall26/' + location.search + location.hash);</script>
          </head><body><p>The seminar page is at <a href="/GOLGFall26/">/GOLGFall26/</a>.</p></body></html>
          HTML
      - name: Build website
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
